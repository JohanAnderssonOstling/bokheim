[package]
name = "Html-Prototype"
version = "0.1.0"
edition = "2024"

[dependencies]
floem = {version = "0.2.0", features = ["rfd-async-std", "default-image-formats", "default", "vello"]}
floem_renderer = {version = "0.2.0"}
rustc_data_structures = "0.1.2"
scraper = "0.22"
lightningcss = { version = "1.0.0-alpha.68", features = ["substitute_variables"] }
