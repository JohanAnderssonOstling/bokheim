[package]
name = "embedded-browser-ui"
license.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop-helper"]
desktop-helper = []
release-logging = ["log/release_max_level_info"]

[[bin]]
name = "bokheim-browser"
path = "src/main.rs"
required-features = ["desktop-helper"]

[dependencies]
ui-text = { path = "../../../ui-text" }
async-channel = "2"
log = "0.4"
app-preferences = { path = "../../../../client/preferences" }
embedded-browser = { path = "../../../../client/embedded-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui.workspace = true
gpui-component.workspace = true
ui-components = { path = "../../../components" }

[target.'cfg(not(target_os = "android"))'.dependencies]
book-model = { path = "../../../../shared/book-model" }
client-platform-runtime = { path = "../../../../client/platforms/runtime", features = ["linux-network-cost"] }
anyhow = "1"
blake3 = "1"
getrandom = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }
url = "2"
wry = { package = "lb-wry", version = "0.53.3" }
gpui_platform.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11rb = { version = "0.13", features = ["shape"] }
webkit2gtk = { version = "2.0.1", features = ["v2_34"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
