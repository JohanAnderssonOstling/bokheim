[package]
name = "desktop-gpui"
version = "0.1.6"
edition = "2024"

[features]
default = ["desktop"]
audiobooks = ["dep:audiobook-player", "browser-ui/audiobooks"]
desktop = [
    "audiobooks",
    "dep:gpui_platform",
    "dep:image",
    "dep:reqwest",
    "dep:semver",
    "dep:sha2",
    "epub_svelte_lib/desktop",
    "browser-ui/desktop-backend",
    "reader-ui/desktop-backend",
    "reader-ui/native-audio",
    "reader-ui/pdf",
]
# Flatpak installs PDFium as /app/lib/libpdfium.so. Keep this separate from the
# normal desktop feature so standalone binaries remain self-contained.
flatpak = ["desktop", "reader-ui/packaged-pdfium"]
kobo = ["dep:gpui_kobo", "dep:kobo-device", "epub_svelte_lib/scanner", "browser-ui/kobo", "reader-ui/kobo"]

[[bin]]
name = "desktop-gpui"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "desktop-gpui-kobo"
path = "src/bin/desktop-gpui-kobo.rs"
required-features = ["kobo"]

[dependencies]
async-channel = "2"
audiobook-player = { path = "../ui/gpui/audiobook-player", optional = true }
ui-runtime = { path = "../ui/gpui/runtime" }
ui-components = { path = "../ui/gpui/components" }
browser-ui = { path = "../ui/gpui/browser", default-features = false }
epub_svelte_lib = { package = "epub-svelte", path = "../../client/backend", default-features = false }
gpui.workspace = true
gpui-component.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui_kobo = { path = "../../../GPUI-Fork/crates/gpui_kobo", optional = true }
image = { version = "0.25.1", default-features = false, features = ["png"], optional = true }
kobo-device = { path = "../kobo-device", optional = true }
log = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
reader-ui = { path = "../ui/gpui/reader", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
