[package]
name = "browser-ui"
version = "0.1.0"
edition = "2024"

[features]
default = []
audiobooks = ["dep:audiobook-player"]
filesystem-libraries = []
kobo = ["dep:gpui_kobo", "ui-components/kobo"]
mobile = ["ui-components/mobile"]

[dependencies]
async-channel = "2"
app-contract = { path = "../../../../client/app-contract" }
audiobook-player = { path = "../audiobook-player", optional = true }
ui-components = { path = "../components" }
gpui.workspace = true
gpui-component.workspace = true
gpui_kobo = { path = "../../../../../GPUI-Fork/crates/gpui_kobo", optional = true }
html.workspace = true
html-view-core.workspace = true
html-view-gpui = { path = "../../../renderers/html/crates/html-view-gpui" }
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }
log = "0.4"
chrono = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
sync-common = { path = "../../../../shared/sync-common" }
uuid = { version = "1", features = ["v4"] }
web-time = "1"

[dev-dependencies]
gpui_platform.workspace = true
serde_json = "1"
