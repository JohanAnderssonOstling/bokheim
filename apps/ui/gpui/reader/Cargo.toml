[package]
name = "reader-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["pdf"]
audiobooks = ["dep:audiobook-player"]
kobo = ["dep:gpui_kobo"]
mobile = ["ui-components/mobile"]
pdf = ["dep:pdf-reader-core", "dep:pdf-view-gpui"]
packaged-pdfium = ["pdf", "pdf-reader-core/packaged-pdfium"]

[dependencies]
app-preferences = { path = "../../../../client/preferences" }
bokheim-backend = { path = "../../../../client/backend", default-features = false }
async-channel = "2"
ui-components = { path = "../components" }
audiobook-player = { path = "../audiobook-player", optional = true }
gpui.workspace = true
gpui-component.workspace = true
gpui_kobo = { path = "../../../../../GPUI-Fork/crates/gpui_kobo", optional = true }
html-view-core.workspace = true
html-view-gpui = { path = "../../../renderers/html/crates/html-view-gpui" }
html.workspace = true
html-publication = { path = "../../../renderers/html/crates/html-publication" }
library-model = { path = "../../../../client/library-model" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "js"] }
web-time = "1"
smallvec = "1"
sync-common = { path = "../../../../shared/sync-common" }
pdf-reader-core = { path = "../../../renderers/pdf/core", optional = true }
pdf-view-gpui = { path = "../pdf-view", optional = true }
