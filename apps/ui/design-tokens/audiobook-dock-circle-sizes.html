<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bokheim · Desktop dock circle sizes</title>
  <style>
    @font-face { font-family: Garamond; src: url('../../desktop-gpui/assets/fonts/NV_Garamond-Regular.ttf'); }
    @font-face { font-family: Raleway; src: url('../../desktop-gpui/assets/fonts/Raleway-Regular.ttf'); }
    @font-face { font-family: Bodoni; src: url('../../desktop-gpui/assets/fonts/BodoniModa-Regular.ttf'); }
    :root { font-size: 16px; --canvas: #eae5dc; --paper: #f6f2eb; --ink: #22201d; --muted: #6b675f; --rule: #c5bdac; --accent: #466853; --accent-ink: #fffdfa; }
    [data-theme="dark"] { color-scheme: dark; --canvas: #1c1a16; --paper: #11100d; --ink: #efe6d0; --muted: #a69c86; --rule: #4e4334; --accent: #d3b271; --accent-ink: #11100d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    main { padding: 32px; max-width: 1440px; margin: auto; }
    .study-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font: 13px/1.5 Raleway, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: normal; }
    .study-header p { margin: 0; color: var(--muted); }
    .theme { padding: 8px 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; cursor: pointer; }
    article { margin-bottom: 32px; }
    .variant-label { display: flex; align-items: baseline; justify-content: space-between; padding: 0 0 12px; font: 13px/1.5 Raleway, sans-serif; }
    .variant-label h2 { margin: 0; font-size: 16px; font-weight: normal; }
    .variant-label span { color: var(--muted); }
    .window { border: 1px solid var(--rule); background: var(--paper); }
    .context { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font: 12px/1 Raleway, sans-serif; color: var(--muted); }
    .wordmark { font: 21px/1 Bodoni, serif; color: var(--ink); }
    .dock { height: calc(5rem + 1px); position: relative; border-top: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .5rem; padding-right: .5rem; align-items: center; font: 1rem/1.25 Garamond, serif; }
    .track { position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 3px; background: var(--rule); }
    .track::before { content: ''; display: block; width: 36%; height: 100%; background: var(--accent); }
    .leading { min-width: 0; height: 5rem; display: flex; gap: .5rem; align-items: center; }
    .cover { width: 5rem; height: 5rem; flex: none; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; background: #354d3d; color: #eee2c7; text-align: center; padding: 7px; }
    .cover-title { font: 14px/1.05 Garamond, serif; }
    .cover-author { font: 7px/1.2 Raleway, sans-serif; letter-spacing: .5px; text-transform: uppercase; }
    .book { min-width: 0; }
    .book-title, .chapter, .chapter-time { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .book-title { margin-bottom: 3px; }
    .chapter, .chapter-time, .remaining { font-size: .75rem; color: var(--muted); line-height: 1.25; }
    .chapter-time { margin-top: 3px; font-variant-numeric: tabular-nums; }
    .transport { display: flex; align-items: center; gap: .25rem; }
    button { padding: 0; border: 0; background: transparent; color: inherit; display: inline-flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .transport button { width: 2.5rem; height: 2.5rem; }
    .icon { display: block; width: 1.25rem; height: 1.25rem; background: currentColor; mask: var(--icon) center / contain no-repeat; -webkit-mask: var(--icon) center / contain no-repeat; }
    .transport .play { width: var(--play-size); height: var(--play-size); border-radius: 50%; background: var(--accent); color: var(--accent-ink); }
    .play .icon { width: 2rem; height: 2rem; }
    .tools { min-width: 0; justify-self: end; display: flex; align-items: flex-end; flex-direction: column; gap: .25rem; }
    .tool-row { display: flex; align-items: center; gap: .5rem; }
    .tool-row button { width: 2rem; height: 2rem; }
    .tool-row .icon { width: 1rem; height: 1rem; }
    .tool-row .speed { width: auto; padding: 0 .5rem; font: .875rem/1 Garamond, serif; }
    .note { margin: 0; color: var(--muted); font: 12px/1.5 Raleway, sans-serif; }
    @media (max-width: 900px) { main { min-width: 900px; padding: 24px; } }
  </style>
</head>
<body>

      <div><h1>Desktop audiobook dock</h1><p>Two play-circle sizes · 16 px UI font · Identical dock height and icons</p></div>
      <button class="theme" type="button" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">Light / dark</button>
    </header>
    <div id="variants"></div>
    <p class="note">Both docks: 5 rem + 1 px border (81 px). Play icon: 2 rem (32 px). Only the circle diameter changes.</p>

</html>
