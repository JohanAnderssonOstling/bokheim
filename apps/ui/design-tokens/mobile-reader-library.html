<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokheim · Return to library</title>
<style>
@font-face{font-family:Reader;src:url('../../desktop-gpui/assets/fonts/NV_Garamond-Regular.ttf')}
@font-face{font-family:Interface;src:url('../../desktop-gpui/assets/fonts/Raleway-Regular.ttf')}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:#eeede9;color:#292b28;font:14px/1.5 Interface,Arial,sans-serif}
main{max-width:1040px;margin:0 auto;padding:30px 32px}h1{font:36px Reader,Georgia,serif;margin:0 0 8px}header p{margin:0;color:#65665e;max-width:720px}header{padding-bottom:22px;border-bottom:1px solid #cecec5}
.examples{display:flex;gap:52px;justify-content:center;margin-top:25px;align-items:flex-start;flex-wrap:wrap}figure{margin:0;width:390px;max-width:100%}figcaption{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}figcaption span{color:#74756e;font-size:12px}
.phone{height:760px;background:#faf9f4;border:1px solid #a6a79d;position:relative;overflow:hidden;--paper:#faf9f4;--line:#d9d9cf;--accent:#526548}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;font:12px Arial,sans-serif;background:var(--paper)}.battery{display:flex;align-items:center;gap:6px}.battery i{width:18px;height:9px;border:1px solid currentColor;display:inline-block;position:relative}.battery i:after{content:'';position:absolute;inset:1px;background:currentColor;width:11px}
.reader{position:absolute;inset:30px 0 22px}.top{height:48px;position:absolute;inset:0 0 auto;display:flex;align-items:center;padding:0 10px;gap:9px;border-bottom:1px solid var(--line);background:var(--paper);z-index:2}.progress{font-size:11px;color:#707267}.title{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:hover{background:#e9eade}button:focus-visible{outline:2px solid #526548;outline-offset:-3px}button img{width:23px;height:23px;display:block}button.icon{width:40px;height:44px;display:grid;place-items:center;flex:none}
.prose{height:100%;overflow:auto;padding:74px 30px 100px;font:23px/1.48 Reader,Georgia,serif;scrollbar-width:none}.prose h2{font:normal 27px/1.2 Reader,Georgia,serif;margin:0 0 24px;text-align:center}.prose p{margin:0 0 16px}.prose .source{text-align:center;font:11px Interface,Arial,sans-serif;color:#75776b;letter-spacing:1px;margin-bottom:14px}.prose a{color:#526548;text-decoration:underline;cursor:pointer}
.history{position:absolute;top:48%;left:8px;width:44px;height:44px;border:1px solid #b7baab;border-radius:50%;background:var(--paper);display:grid;place-items:center;z-index:2}
.bottom{position:absolute;inset:auto 0 0;height:66px;display:flex;border-top:1px solid var(--line);background:var(--paper);z-index:3}.destination{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:3px 1px;font-size:10px}.destination .aa{font:23px Georgia,serif;height:23px;line-height:23px}.destination.library{border-right:1px solid var(--line)}.destination.active{color:var(--accent);background:#e8ecdf}
.gesture{height:22px;position:absolute;bottom:0;left:0;right:0;display:grid;place-items:center;background:var(--paper)}.gesture:after{content:'';width:100px;height:3px;border-radius:3px;background:#30332c}
.phone.hide-controls .top,.phone.hide-controls .bottom,.phone.hide-controls .history{display:none}.caption{color:#65665e;margin:12px 0;font-size:12px}.reset{padding:7px 10px;border:1px solid #b6b8ab;font-size:12px}
.library-screen{position:absolute;inset:30px 0 22px;background:var(--paper);padding:18px 20px}.library-screen h2{font:30px Reader,Georgia,serif;margin:0 0 22px}.library-screen h3{font-size:13px;font-weight:400;border-bottom:1px solid var(--line);padding-bottom:10px}.book-card{width:100%;text-align:left;display:flex;align-items:center;gap:18px;padding:15px 0;border-bottom:1px solid var(--line)}.cover{width:75px;height:108px;background:#55634c;color:#fff;padding:16px 8px;text-align:center;font:15px Reader,Georgia,serif;display:grid;align-content:center}.book-card small{display:block;color:#73756b;margin-top:7px}.sheet{position:absolute;inset:auto 0 66px;min-height:190px;background:var(--paper);border-top:1px solid #b6b8ab;z-index:4;padding:16px 22px}.sheet header{display:flex;justify-content:space-between;align-items:center;padding:0 0 12px}.sheet h3{font-size:18px;font-weight:400;margin:0}.sheet p{font:18px Reader,Georgia,serif}.footnote{margin-top:25px;color:#707267;font-size:12px}
@media(max-width:500px){main{padding:20px 12px}.phone{height:740px}.examples{gap:25px}h1{font-size:30px}}
</style>
</head>
<body><main>
<header><h1>A direct way back to your library</h1><p>Library stays at the left of the bottom bar. The header keeps its space for the title and search; the side arrow keeps its reading-history role.</p></header>
<div class="examples" id="examples"></div>
<p class="footnote">Interactive layout mockup · Tap Library to leave either reader. Tap the page to hide or show its controls.</p>
</main>
<script>
const icons='assets/phosphor-light/';
const icon=(name)=>`<img src="${icons+name}.svg" alt="">`;
const bookText=`<h2>Chapter III</h2><p>Not all that Mrs. Bennet, however, with the assistance of her five daughters, could ask on the subject, was sufficient to draw from her husband any satisfactory description of Mr. Bingley.</p><p>They attacked him in various ways—with barefaced questions, ingenious suppositions, and distant surmises; but he eluded the skill of them all; and they were at last obliged to accept the second-hand intelligence of their neighbour, Lady Lucas.</p><p>Her report was highly favourable. Sir William had been delighted with him. He was quite young, wonderfully handsome, extremely agreeable, and, to crown the whole, he meant to be at the next assembly with a large party.</p>`;
const wikiText=`<div class="source">WIKIPEDIA</div><h2>Jane Austen</h2><p>Jane Austen was an English novelist whose works explore the lives, relationships, and social expectations of the English landed gentry.</p><p>Her novels include <a>Pride and Prejudice</a>, <a>Sense and Sensibility</a>, and <a>Emma</a>. Her use of irony and close observation of social life helped establish her enduring literary reputation.</p><p>Much of her fiction follows women navigating family obligations, financial uncertainty, and marriage. The novels combine intimate domestic settings with sharp social criticism.</p><p>Austen’s work continues to be widely read and adapted for film and television.</p>`;
function makePhone(wiki){
 const figure=document.createElement('figure');
 const tabs=wiki?['Library','Contents','Settings','Read aloud']:['Library','Contents','Notes','Bookmarks','Settings','Read aloud'];
 const glyphs={'Library':'books','Contents':'list','Notes':'pencil','Bookmarks':'bookmark','Read aloud':'headphones'};
 figure.innerHTML=`<figcaption>${wiki?'Wikipedia article':'EPUB book'}<span>390 px · ${tabs.length} actions</span></figcaption><div class="phone"><div class="status"><span>9:41</span><span class="battery">▴ ▴ <i></i></span></div><div class="reader"><article class="prose">${wiki?wikiText:bookText}</article><div class="top"><span class="progress">${wiki?'1 / 8':'18%'}</span><span class="title">${wiki?'Jane Austen':'Pride and Prejudice: Chapter III'}</span><button class="icon search" aria-label="Search">${icon('magnifying-glass')}</button></div><button class="history" aria-label="Previous reading position" title="Previous reading position">${icon('arrow-left')}</button><nav class="bottom" aria-label="Reader actions">${tabs.map(t=>`<button class="destination ${t==='Library'?'library':''}" data-action="${t}">${t==='Settings'?'<span class="aa">Aa</span>':icon(glyphs[t])}<span>${t}</span></button>`).join('')}</nav><section class="sheet" hidden><header><h3></h3><button class="icon close" aria-label="Close">×</button></header><p></p></section></div><section class="library-screen" hidden><h2>Library</h2><h3>Continue reading</h3><button class="book-card"><span class="cover">Pride and<br>Prejudice</span><span>Pride and Prejudice<small>Jane Austen</small><small>Chapter III · 18%</small></span></button></section><div class="gesture"></div></div><p class="caption">${wiki?'The same bar, with fewer actions. Library leaves the article and reader together.':'All existing book actions remain available. Library has a fixed position and a small divider.'}</p><button class="reset">Reset ${wiki?'article':'book'} preview</button>`;
 const phone=figure.querySelector('.phone'),reader=figure.querySelector('.reader'),library=figure.querySelector('.library-screen'),sheet=figure.querySelector('.sheet');
 function reset(){reader.hidden=false;library.hidden=true;sheet.hidden=true;phone.classList.remove('hide-controls');figure.querySelectorAll('.active').forEach(b=>b.classList.remove('active'));figure.querySelector('.prose').innerHTML=wiki?wikiText:bookText}
 function openSheet(name){sheet.hidden=false;sheet.querySelector('h3').textContent=name;sheet.querySelector('p').textContent=({Contents:'Chapter I · Chapter II · Chapter III',Notes:'Your notes and highlighted passages.',Bookmarks:'Your saved reading positions.',Settings:'Font · Text size · Margins',Search:'Search this document','Read aloud':'Play · Voice · Sleep timer'})[name]||name}
 figure.querySelector('.prose').onclick=e=>{if(e.target.closest('a')){e.preventDefault();openSheet(e.target.textContent);return}phone.classList.toggle('hide-controls')};
 figure.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='Library'){reader.hidden=true;library.hidden=false;phone.classList.remove('hide-controls')}else openSheet(b.dataset.action)});
 figure.querySelector('.search').onclick=()=>openSheet('Search');figure.querySelector('.close').onclick=()=>sheet.hidden=true;figure.querySelector('.history').onclick=()=>{figure.querySelector('.prose').innerHTML=wiki?'<h2>Pride and Prejudice</h2><p>The previous article in your reading history.</p>':'<h2>Chapter II</h2><p>The previous position in your reading history.</p>'};figure.querySelector('.book-card').onclick=reset;figure.querySelector('.reset').onclick=reset;
 return figure;
}
document.getElementById('examples').append(makePhone(false),makePhone(true));
</script>
</body></html>
