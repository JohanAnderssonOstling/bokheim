<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokheim · Audiobook chapter timing · Desktop and mobile</title>
<style>
@font-face{font-family:Raleway;src:url('../../desktop-gpui/assets/fonts/Raleway-Regular.ttf')}
@font-face{font-family:Raleway;src:url('../../desktop-gpui/assets/fonts/Raleway-Bold.ttf');font-weight:700}
@font-face{font-family:Bodoni;src:url('../../desktop-gpui/assets/fonts/BodoniModa-Regular.ttf')}
*{box-sizing:border-box}
:root{color-scheme:light;--paper:#f6f2eb;--ink:#22201d;--muted:#6b675f;--rule:#c5bdac;--accent:#466853;--accent-ink:#fffdfa;--hover:#46685314}
body{margin:0;background:#eae5dc;color:var(--ink);font:16px/1.45 Raleway,sans-serif}
body.dark{color-scheme:dark;--paper:#1e1c18;--ink:#efe6d0;--muted:#a69c86;--rule:#4e4334;--accent:#d3b271;--accent-ink:#11100d;--hover:#d3b27114;background:#12110f}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
main{max-width:1580px;margin:auto;padding:28px 32px 36px}
.review-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}
h1{font:400 34px/1.2 Bodoni,Georgia,serif;margin:0 0 7px}
.review-header p{font-size:13px;color:var(--muted);margin:0}
.theme-toggle{border:1px solid var(--rule);padding:8px 13px;white-space:nowrap}
.examples{display:grid;grid-template-columns:minmax(680px,1fr) 390px;gap:30px;align-items:start}
figure{margin:0;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px;margin-bottom:12px}
figcaption strong{font-weight:700;color:var(--ink)}
.app{background:var(--paper);border:1px solid var(--rule);height:790px;overflow:hidden;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;gap:24px;padding:18px 24px;border-bottom:1px solid var(--rule);flex:none}
.wordmark{font:28px/1 Bodoni,Georgia,serif}.crumb{font-size:14px;color:var(--muted)}
.desktop-body{display:grid;grid-template-columns:240px minmax(0,1fr);flex:1;min-height:0}
.book{padding:28px 24px;border-right:1px solid var(--rule)}
.cover{aspect-ratio:1;background:#183e33;color:#e9dfb8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;outline:1px solid #e9dfb854;outline-offset:-10px;padding:22px}
.cover small{font-size:9px;letter-spacing:.12em;margin-bottom:14px}.cover strong{font:30px/.98 Bodoni,Georgia,serif}.cover em{font-size:10px;margin-top:20px}
.book h2{font:24px/1.15 Bodoni,Georgia,serif;margin:22px 0 9px}.book p{font-size:13px;color:var(--muted);margin:5px 0}
.book .length{padding-top:16px;margin-top:18px;border-top:1px solid var(--rule)}
.chapter-panel{display:flex;flex-direction:column;min-width:0;min-height:0;padding:26px 24px 0}
.chapter-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex:none}
.chapter-heading h2{font:26px/1.2 Bodoni,Georgia,serif;margin:0}.count{font:13px Raleway,sans-serif;color:var(--muted);margin-left:9px}
.reset{font-size:23px;width:32px;height:32px}.reset:hover{background:var(--hover)}
.chapter-columns{display:flex;align-items:center;gap:4px;padding:8px;border-top:1px solid var(--rule);border-bottom:1px solid color-mix(in srgb,var(--rule) 45%,transparent);color:var(--muted)}
.chapter-list{overflow:auto;scrollbar-width:thin;min-height:0;flex:1}
.chapter-row{display:flex;align-items:center;gap:4px;width:100%;min-height:36px;padding:8px;text-align:left;border-bottom:1px solid color-mix(in srgb,var(--rule) 45%,transparent)}
.chapter-row:hover{background:var(--hover)}.chapter-row[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
.chapter-row[aria-current=true]:hover{filter:brightness(.96)}.chapter-row.read{color:var(--muted)}
.chapter-copy{flex:1;min-width:0}.chapter-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:16px;line-height:1.4}
.chapter-timing{display:contents;color:var(--muted)}
.chapter-timing span,.chapter-columns>span:not(.chapter-copy):not(.read-status){width:5.125rem;flex:none;text-align:right;white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}.chapter-row[aria-current=true] .chapter-timing{color:var(--accent-ink)}
.read-status{width:32px;flex:none;text-align:center;font-size:17px}
.mini-player{display:flex;align-items:center;gap:16px;padding:14px 24px;border-top:1px solid var(--rule);font-size:13px;flex:none}
.mini-player .copy{flex:1;min-width:0}.mini-player small{display:block;color:var(--muted);margin-top:3px}.play{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:15px}
.mobile .app{height:790px}.mobile .app-header{padding:17px 16px;justify-content:space-between}.mobile .app-header h2{font:25px/1.1 Bodoni,Georgia,serif;margin:0}.close{font-size:25px;width:32px;height:32px}
.mobile .book-title{padding:15px 16px 0;margin:0;font-size:14px;color:var(--muted)}
.mobile .chapter-panel{padding:17px 16px 0}.mobile .chapter-heading{margin-bottom:12px}.mobile .chapter-heading h2{font:14px Raleway,sans-serif;color:var(--muted)}
.mobile .mini-player{padding:12px 16px}.mobile .chapter-row{padding-top:12px;padding-bottom:12px}
.note{color:var(--muted);font-size:13px;margin:16px 0 0;max-width:850px}
@media(max-width:1150px){.examples{grid-template-columns:1fr}.mobile{width:min(390px,100%)}.desktop{min-width:680px}.examples{overflow-x:auto}}
@media(max-width:650px){main{padding:20px 12px}.review-header{align-items:flex-start}h1{font-size:27px}.theme-toggle{font-size:13px}}
</style>
</head>
<body>
<main>
  <header class="review-header"><div><h1>Audiobook chapter timing</h1><p>HTML design preview of the shared chapter rows · Example book and playback state</p></div><button class="theme-toggle" aria-pressed="false">Dark mode</button></header>
  <div class="examples">
    <figure class="desktop"><figcaption><strong>Desktop</strong><span>Book details · chapter panel</span></figcaption><section class="app" aria-label="Desktop chapter preview">
      <header class="app-header"><span class="wordmark">bokheim</span><span class="crumb">My library / The Secret Garden</span></header>
      <div class="desktop-body"><aside class="book"><div class="cover"><small>FRANCES HODGSON BURNETT</small><strong>The<br>Secret<br>Garden</strong><em>UNABRIDGED AUDIOBOOK</em></div><h2>The Secret Garden</h2><p>Frances Hodgson Burnett</p><p>Narrated by Karen Savage</p><p class="length">27 chapters</p></aside><section class="chapter-panel"><header class="chapter-heading"><h2>Chapters <span class="count">27</span></h2><button class="reset" aria-label="Reset chapter read status" title="Reset chapter read status">↶</button></header><div class="chapter-columns"><span class="chapter-copy"></span><span>Start</span><span>Duration</span><span class="read-status"></span></div><div class="chapter-list" aria-label="Desktop chapters"></div></section></div>
      <footer class="mini-player"><div class="copy">The Secret Garden<small class="playing-chapter">Martha · Paused</small></div><button class="play" aria-label="Play preview">▶</button></footer>
    </section><p class="note">Start times use the book’s timeline. Durations use the original audio length, regardless of playback speed.</p></figure>
    <figure class="mobile"><figcaption><strong>Mobile</strong><span>390 px · Chapters sheet</span></figcaption><section class="app" aria-label="Mobile chapter preview">
      <header class="app-header"><h2>Chapters</h2><button class="close" aria-label="Close chapters preview">×</button></header><p class="book-title">The Secret Garden</p><section class="chapter-panel"><header class="chapter-heading"><h2>27 chapters</h2><button class="reset" aria-label="Reset chapter read status" title="Reset chapter read status">↶</button></header><div class="chapter-columns"><span class="chapter-copy"></span><span>Start</span><span>Duration</span><span class="read-status"></span></div><div class="chapter-list" aria-label="Mobile chapters"></div></section>
      <footer class="mini-player"><div class="copy">The Secret Garden<small class="playing-chapter">Martha · Paused</small></div><button class="play" aria-label="Play preview">▶</button></footer>
    </section><p class="note">Start and duration keep their own aligned columns, including on mobile.</p></figure>
  </div>
</main>
<script>
const chapters=[['There Is No One Left',1218],['Mistress Mary Quite Contrary',1641],['Across the Moor',1320],['Martha',2364],['The Cry in the Corridor',1094],['“There Was Some One Crying—There Was!”',1495],['The Key of the Garden',1127],['The Robin Who Showed the Way',1340],['The Strangest House Any One Ever Lived In',1499],['Dickon',1858],['The Nest of the Missel Thrush',1528],['“Might I Have a Bit of Earth?”',1366],['“I Am Colin”',1602],['A Young Rajah',1398],['Nest Building',1247],['“I Won’t!” Said Mary',1026],['A Tantrum',1270],['“Tha’ Munnot Waste No Time”',1263],['“It Has Come!”',1055],['“I Shall Live Forever—and Ever—and Ever!”',1308],['Ben Weatherstaff',1256],['When the Sun Went Down',1035],['Magic',1587],['“Let Them Laugh”',1239],['The Curtain',980],['“It’s Mother!”',1224],['In the Garden',1743]];
let active=3,playing=false;
const read=new Set([0,1,2]);
function time(seconds){const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=String(seconds%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${s}`:`${m}:${s}`}
function render(){for(const list of document.querySelectorAll('.chapter-list')){list.replaceChildren();let start=0;chapters.forEach(([title,duration],index)=>{const row=document.createElement('button');row.className=`chapter-row${read.has(index)?' read':''}`;row.setAttribute('aria-current',String(index===active));const copy=document.createElement('span');copy.className='chapter-copy';const name=document.createElement('span');name.className='chapter-title';name.textContent=title;const timing=document.createElement('span');timing.className='chapter-timing';for(const value of [time(start),time(duration)]){const field=document.createElement('span');field.textContent=value;timing.append(field)}copy.append(name);const status=document.createElement('span');status.className='read-status';status.textContent=read.has(index)?'✓':'';row.append(copy,timing,status);row.addEventListener('click',()=>{const positions=[...document.querySelectorAll('.chapter-list')].map(list=>list.scrollTop);active=index;render();[...document.querySelectorAll('.chapter-list')].forEach((list,i)=>list.scrollTop=positions[i])});list.append(row);start+=duration})}document.querySelectorAll('.playing-chapter').forEach(label=>label.textContent=`${chapters[active][0]} · ${playing?'Playing':'Paused'}`);document.querySelectorAll('.play').forEach(button=>{button.textContent=playing?'Ⅱ':'▶';button.setAttribute('aria-label',playing?'Pause preview':'Play preview')})}
document.querySelector('.theme-toggle').addEventListener('click',event=>{const dark=document.body.classList.toggle('dark');event.currentTarget.textContent=dark?'Light mode':'Dark mode';event.currentTarget.setAttribute('aria-pressed',String(dark))});
document.querySelectorAll('.play').forEach(button=>button.addEventListener('click',()=>{playing=!playing;render()}));
document.querySelectorAll('.reset').forEach(button=>button.addEventListener('click',()=>{read.clear();render()}));
document.querySelector('.close').addEventListener('click',()=>document.querySelector('.mobile .chapter-list').scrollTo({top:0,behavior:'smooth'}));
render();
</script>
</body>
</html>
