<script>
const catalog=JSON.parse(document.querySelector('#dictionary-data').textContent);
const installed=[];
let active=null,details=null,downloadDetails=null;
const element=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
function button(label,action,disabled=false){const node=element('button','',label);node.disabled=disabled;node.addEventListener('click',action);return node}
function row(title,description,control,className=''){const node=element('div','row '+className),copy=element('div','copy');copy.append(element('div','name',title),element('div','description',description));node.append(copy,control);return node}
function sourceDetails(spec){
 const panel=element('div','source-details');panel.id=`source-${spec.id}`;
 panel.append(element('h3','', 'Source and license'),element('div','',spec.source),element('div','edition',`Edition ${spec.version} · ${spec.license}`));
 const links=element('div','source-links');
 for(const [label,url] of [['Source',spec.source_url],['License',`https://creativecommons.org/licenses/by-sa/${spec.license.replace('CC-BY-SA-','')}/`]]){const link=element('a','',label);link.href=url;link.target='_blank';link.rel='noreferrer';links.append(link)}
 panel.append(links);return panel;
}
function render(){
 const list=document.querySelector('#catalog');list.replaceChildren();
 for(const spec of catalog){
  const exists=installed.some(item=>item.spec.id===spec.id);
  const control=button(exists?'Installed':active===spec.id?'Downloading':'Download',()=>download(spec),exists||active!==null);
  control.setAttribute('aria-label',`${exists?'Installed':active===spec.id?'Downloading':'Download'} ${spec.name} dictionary`);
  const item=element('div','download-row');
  const infoId=`info-${spec.id}`;
  const info=button('',()=>{downloadDetails=downloadDetails===spec.id?null:spec.id;render();document.getElementById(infoId).focus({preventScroll:true})});
  info.className='info';info.id=infoId;info.title=`Source and license for ${spec.name}`;info.setAttribute('aria-label',info.title);info.setAttribute('aria-expanded',String(downloadDetails===spec.id));info.setAttribute('aria-controls',`source-${spec.id}`);
  info.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".5" fill="currentColor"/></svg>';
  const actions=element('div','download-actions');actions.append(element('span','download-size',`${(spec.bytes/(1024*1024)).toFixed(1)} MiB`),info,control);
  item.append(element('span','download-name',spec.name),actions);list.append(item);
  if(downloadDetails===spec.id)list.append(sourceDetails(spec));
 }
 document.querySelector('#empty').hidden=installed.length>0;
 document.querySelector('#import').disabled=active!==null;
 document.querySelector('#download-dictionary').disabled=active!==null;
 const installedList=document.querySelector('#installed');installedList.replaceChildren();
 for(const [index,item] of installed.entries()){
  const controls=element('div','controls');
  controls.append(button(item.enabled?'Enabled':'Disabled',()=>{item.enabled=!item.enabled;render()}),button('Move up',()=>move(index,-1),index===0),button('Move down',()=>move(index,1),index===installed.length-1),button('Remove',()=>{installed.splice(index,1);render()}),button('Details',()=>{details=details===item.spec.id?null:item.spec.id;render()}));
  installedList.append(row(item.spec.name,`${(item.spec.bytes/(1024*1024)).toFixed(1)} MiB download · searched in this order`,controls,'installed'));
  if(details===item.spec.id)installedList.append(sourceDetails(item.spec));
 }
}
function download(spec){
 if(active!==null)return;
 document.querySelector('#picker').close();
 active=spec.id;
 const status=document.querySelector('#status');status.hidden=false;status.textContent=`Downloading ${spec.name} dictionary (preview simulation)`;render();
 setTimeout(()=>{installed.push({spec,enabled:true});active=null;status.textContent=`${spec.name} dictionary installed in this preview. No files were downloaded.`;render()},900);
}
function move(index,direction){const next=index+direction;[installed[index],installed[next]]=[installed[next],installed[index]];render()}
document.querySelector('#download-dictionary').addEventListener('click',()=>{downloadDetails=null;render();document.querySelector('#picker').showModal()});
document.querySelector('#close').addEventListener('click',()=>document.querySelector('#picker').close());
document.querySelector('#picker').addEventListener('click',event=>{if(event.target.id==='picker'){const bounds=event.target.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)event.target.close()}});
document.querySelector('#import').addEventListener('click',()=>{const status=document.querySelector('#status');status.hidden=false;status.textContent='In the app, this opens a file picker for your StarDict ZIP or matching .ifo, .idx, .dict and optional .syn files.'});
render();
if(location.hash==='#download')document.querySelector('#picker').showModal();
</script>
