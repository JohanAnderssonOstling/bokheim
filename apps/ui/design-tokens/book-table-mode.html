<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokheim · Book table mode</title>
<style>
@font-face{font-family:Garamond;src:url('../../desktop-gpui/assets/fonts/NV_Garamond-Regular.ttf')}
@font-face{font-family:Garamond;src:url('../../desktop-gpui/assets/fonts/NV_Garamond-Bold.ttf');font-weight:700}
@font-face{font-family:Jost;src:url('../../desktop-gpui/assets/fonts/NV_Jost-Regular.ttf')}
:root{color-scheme:light;--canvas:#eae6de;--paper:#f6f2eb;--ink:#22201d;--muted:#6b675f;--rule:#c5bdac;--accent:#466853;--accent-ink:#fffdfa;--wash:#d9e8de;--hover:#4668530c;--icon-filter:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Jost,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:0}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;cursor:pointer;margin:0;vertical-align:middle}
img.icon{width:21px;height:21px;display:block;flex:none;filter:var(--icon-filter)}
main{max-width:1480px;margin:auto;padding:30px 34px 60px}
h1{font:normal 38px/1.15 Garamond,Georgia,serif;margin:7px 0 10px}
.preview{scroll-margin-top:20px;margin-top:32px;min-width:0}
.preview-label{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0 0 12px}
.preview-label h2{font:normal 23px/1.2 Garamond,Georgia,serif;margin:0}
.app{position:relative;min-width:0;overflow:hidden;border:1px solid var(--rule);background:var(--paper);font:18px/1.3 Garamond,Georgia,serif}
.desktop.app{display:grid;grid-template-columns:80px minmax(0,1fr);min-height:910px}
.rail{display:flex;align-items:center;flex-direction:column;min-height:0}
.rail-item{height:80px;width:80px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
.rail-item img{width:24px;height:24px}
.rail-item.current{background:var(--accent);color:var(--accent-ink)}
.rail-item.current img{filter:brightness(0) invert(1)}
.rail-item:last-child{margin-top:auto}
.library{min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:8px}
.page-title{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:18px;white-space:nowrap}
.page-title img{width:14px;height:14px}
.desktop .page-title img{display:none}
.topbar-actions{display:flex;align-items:center;gap:8px;flex:none}
.action{width:32px;height:32px;display:grid;place-items:center;padding:0;flex:none}
.topbar img.icon{width:16px;height:16px}
.switch{display:inline-flex;flex:none;border:1px solid var(--rule);align-items:center;height:32px}
.switch button{display:flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border-right:1px solid var(--rule);white-space:nowrap}
.switch button:last-child{border-right:0}
.switch [aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.switch [aria-pressed=true] img{filter:brightness(0) invert(1)}
.tools{padding:0 8px 8px}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);height:36px}
.search input{background:none;border:0;outline:0;min-width:0;width:100%;font-size:inherit;padding:5px 0}
.search:focus-within{border-bottom-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.selection{display:flex;align-items:center;gap:8px;padding:11px 24px;background:var(--wash);border-top:1px solid var(--rule);font-size:17px}
.selection strong{font-weight:400}
.selection button{margin-left:auto;text-decoration:underline;text-underline-offset:3px;padding:2px 6px}
.table-area{padding:0 8px;min-width:0;min-height:0;flex:1;overflow:auto}
table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:left;font-size:18px}
th{color:var(--muted);font-weight:400;font-size:15px;border-block:1px solid var(--rule);height:39px}
th button{padding:7px 0;width:100%;text-align:left;display:flex;align-items:center;gap:5px;color:inherit;white-space:nowrap}
th[aria-sort]:not([aria-sort=none]){color:var(--ink)}
th[data-col=size] button{justify-content:flex-end}
.sort-arrow{font-family:Jost,system-ui,sans-serif;font-size:14px;min-width:10px}
th,td{padding:10px 9px;vertical-align:middle}
tbody tr{border-bottom:1px solid var(--rule);height:60px}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--hover)}
tbody tr.selected{background:var(--wash)}
th.check,td.check{width:34px;padding-left:0;padding-right:7px;text-align:left}
th.check{padding-top:0;padding-bottom:0}
.select-label{display:grid;place-items:center;min-height:36px;cursor:pointer}
th[data-col=author]{width:19%}
th[data-col=format]{width:67px}
th[data-col=size]{width:92px}
th[data-col=progress]{width:89px}
th[data-col=available]{width:114px}
.title-button{display:block;text-align:left;font:inherit;line-height:1.25;padding:3px 0;width:100%;text-decoration-color:var(--rule);text-underline-offset:3px;overflow-wrap:anywhere}
.title-button:hover{text-decoration:underline;background:none}
.byline{display:none;color:var(--muted);font-size:.86em;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.book-author{line-height:1.25;overflow-wrap:anywhere}
.format,.progress,.available{font-size:.9em;color:var(--muted)}
.size{text-align:right;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.unknown{color:var(--muted)}
.available span{display:flex;gap:7px;align-items:center;white-space:nowrap}
.available img{width:17px;height:17px}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--rule);color:var(--muted);font-size:15px}
.empty{text-align:center;padding:50px 12px;color:var(--muted)}
.cards{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:24px;flex:1}
.card-book{display:flex;flex-direction:column;align-items:start;text-align:left;padding:0;min-width:0;line-height:1.25}
.cover{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;background:var(--wash);border:1px solid var(--rule);font-size:23px;margin-bottom:9px}
.card-book:nth-child(3n+2) .cover{background:var(--accent);color:var(--accent-ink)}
.card-book small{color:var(--muted);font-size:15px;margin-top:4px}
.narrow-pair{display:flex;gap:36px;justify-content:space-between;align-items:start;flex-wrap:wrap}
.kobo-preview{width:632px;max-width:100%}
.mobile-preview{width:390px;max-width:100%;margin-right:auto}
.kobo.app{font-size:22px;--accent:#242424;--accent-ink:#fff;--paper:#fff;--ink:#171717;--muted:#585858;--rule:#b2b2b2;--wash:#eeeeeb;--hover:#00000005;--icon-filter:none;color:var(--ink);color-scheme:light;height:800px}
.mobile.app{font-size:19px;height:800px}
.kobo .library,.mobile .library{height:100%}
.kobo .topbar{height:44px;padding:0 8px;gap:8px}
.kobo .page-title{font-size:24px}
.kobo .topbar-actions{gap:0}
.kobo .action{height:44px;width:44px}
.kobo .topbar img.icon{width:22px;height:22px}
.mobile .topbar{height:64px;padding:8px;gap:0}
.mobile .page-title{font-size:20px}
.mobile .topbar-actions{gap:0}
.mobile .action{height:48px;width:48px}
.mobile .topbar img.icon{width:20px;height:20px}
.kobo .switch{height:44px}
.mobile .switch{height:48px}
.kobo .switch button{height:42px;width:44px;padding:0}
.mobile .switch button{height:46px;width:46px;padding:0}
.kobo .switch-label,.mobile .switch-label{display:none}
.kobo .switch [aria-pressed=true]{background:var(--paper);color:var(--ink);outline:2px solid var(--ink);outline-offset:-2px}
.kobo .switch [aria-pressed=true] img{filter:none}
.kobo .table-area,.mobile .table-area{padding:0 8px}
.kobo table{font-size:22px}
.mobile table{font-size:19px}
.kobo th,.mobile th{font-size:16px}
.kobo th.check,.kobo td.check,.mobile th.check,.mobile td.check{width:48px;padding-left:0;padding-right:4px}
.kobo .select-label,.mobile .select-label{min-height:48px;min-width:44px}
.kobo th[data-col=size]{width:105px}
.mobile th[data-col=size]{width:84px}
.kobo th[data-col=format]{width:68px}
.kobo [data-col=author],.kobo [data-col=progress],.kobo [data-col=available],.mobile [data-col=author],.mobile [data-col=progress],.mobile [data-col=available],.mobile [data-col=format]{display:none}
.kobo .byline,.mobile .byline{display:block}
.kobo .byline-format{display:none}
.kobo td,.mobile td{padding:12px 7px}
.kobo tbody tr,.mobile tbody tr{height:76px}
.kobo input[type=checkbox],.mobile input[type=checkbox]{width:21px;height:21px}
.kobo .selection,.mobile .selection{padding:12px 16px;font-size:18px;flex-wrap:wrap}
.kobo .footer,.mobile .footer{font-size:16px;padding:14px 16px}
.kobo .footer .unknown-count,.mobile .footer .unknown-count{display:none}
.bottom-nav{display:flex;justify-content:space-around;flex:none;border-top:1px solid var(--rule);padding:0;gap:0;height:64px;background:var(--paper);color:var(--muted);font-size:13px}
.bottom-nav span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;flex:1}
.bottom-nav .current{background:var(--accent);color:var(--accent-ink)}
.bottom-nav .current img{filter:brightness(0) invert(1)}
.kobo .bottom-nav .current{background:var(--paper);color:var(--ink);outline:2px solid var(--ink);outline-offset:-2px}
.kobo .bottom-nav .current img{filter:none}
.desktop .bottom-nav{display:none}
.kobo .cards,.mobile .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:6px 16px 20px;overflow:auto}
.kobo .cover,.mobile .cover{font-size:20px}
dialog{width:min(450px,calc(100% - 32px));border:1px solid var(--rule);padding:26px;background:var(--paper);color:var(--ink);font:19px/1.4 Garamond,Georgia,serif}
dialog::backdrop{background:#0006}
dialog header{display:flex;align-items:start;gap:18px}
dialog h2{font-size:29px;font-weight:400;line-height:1.15;margin:0}
dialog header button{margin-left:auto;padding:0;min-width:30px;min-height:30px;display:grid;place-items:center}
dialog .detail-author{color:var(--muted);margin:10px 0 22px}
dialog dl{display:grid;grid-template-columns:1fr auto;margin:0;gap:13px;border-top:1px solid var(--rule);padding-top:20px}
dialog dt{color:var(--muted)}dialog dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.desktop .byline-format{display:none}
@media(max-width:1050px){.desktop [data-col=available]{display:none}.desktop th[data-col=author]{width:21%}}
@media(max-width:820px){main{padding:22px 16px 40px}.desktop.app{grid-template-columns:64px minmax(0,1fr)}.desktop .rail-item{width:64px;height:64px}.desktop [data-col=author],.desktop [data-col=progress]{display:none}.desktop .byline{display:block}.desktop .switch-label{display:none}}
@media(max-width:520px){h1{font-size:32px}.desktop .rail{display:none}.desktop.app{display:block;min-height:600px}.desktop [data-col=format]{display:none}.desktop .byline-format{display:inline}.preview-label{align-items:start;flex-direction:column;gap:4px}.narrow-pair{gap:0}.kobo.app{font-size:19px}.kobo table{font-size:19px}.kobo [data-col=format]{display:none}.kobo .byline-format{display:inline}.kobo th[data-col=size]{width:86px}}
</style>
</head>
<body>
<main>
  <h1>Table mode</h1>
  <section class="preview" id="desktop">
    <div class="preview-label"><h2>Desktop</h2></div>
    <div class="app desktop" data-device="desktop" aria-label="Desktop library mockup"></div>
  </section>
  <div class="narrow-pair">
    <section class="preview kobo-preview" id="kobo">
      <div class="preview-label"><h2>Kobo</h2></div>
      <div class="app kobo" data-device="kobo" aria-label="Kobo library mockup"></div>
    </section>
    <section class="preview mobile-preview" id="mobile">
      <div class="preview-label"><h2>Mobile</h2></div>
      <div class="app mobile" data-device="mobile" aria-label="Mobile library mockup"></div>
    </section>
  </div>
</main>
<dialog id="book-detail" aria-labelledby="detail-title"><header><h2 id="detail-title"></h2><button id="close-detail" aria-label="Close book details"></button></header><p class="detail-author"></p><dl></dl></dialog>
<script>
const books = [
  {id:1,title:'10% Less Democracy',author:'Garett Jones',format:'EPUB',bytes:2400000,progress:37,available:'device',year:2020},
  {id:2,title:'Pride and Prejudice',author:'Jane Austen',format:'EPUB',bytes:1200000,progress:18,available:'device',year:1813},
  {id:3,title:'Thinking with Type',author:'Ellen Lupton',format:'PDF',bytes:86400000,progress:62,available:'device',year:2010},
  {id:4,title:'The Design of Everyday Things',author:'Don Norman',format:'EPUB',bytes:8500000,progress:0,available:'cloud',year:2013},
  {id:5,title:'A Short History of Nearly Everything',author:'Bill Bryson',format:'Audio',bytes:742000000,progress:44,available:'device',year:2003},
  {id:6,title:'Ways of Seeing',author:'John Berger',format:'PDF',bytes:24800000,progress:100,available:'device',year:1972},
  {id:7,title:'The Elements of Typographic Style',author:'Robert Bringhurst',format:'PDF',bytes:38400000,progress:9,available:'device',year:2012},
  {id:8,title:'Emma',author:'Jane Austen',format:'EPUB',bytes:1800000,progress:0,available:'cloud',year:1815},
  {id:9,title:'The Odyssey',author:'Homer',format:'Audio',bytes:516000000,progress:0,available:'cloud',year:null},
  {id:10,title:'The Library at Night',author:'Alberto Manguel',format:'EPUB',bytes:6200000,progress:0,available:'cloud',year:2006},
  {id:11,title:'A Pattern Language: Towns, Buildings, Construction',author:'Christopher Alexander et al.',format:'PDF',bytes:165000000,progress:23,available:'device',year:1977},
  {id:12,title:'Collected Essays',author:'Virginia Woolf',format:'EPUB',bytes:null,progress:0,available:'cloud',year:null}
];
const icon = name => `<img class="icon" src="assets/phosphor-light/${name}.svg" alt="" aria-hidden="true">`;
const escape = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
function size(bytes) {
  if (bytes === null) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let unit = 0;
  while (bytes >= 1000 && unit < units.length - 1) {bytes /= 1000; unit++;}
  return `${new Intl.NumberFormat('en',{maximumFractionDigits:bytes < 10 ? 1 : 0}).format(bytes)} ${units[unit]}`;
}
function totalLabel(rows) {
  if (!rows.length) return '—';
  const unknown = rows.filter(book => book.bytes === null).length;
  const total = rows.reduce((sum,book) => sum + (book.bytes ?? 0),0);
  if (unknown === rows.length) return 'Size unknown';
  return `${size(total)}${unknown ? ` known · ${unknown} unknown` : ''}`;
}
function header(key,label) {return `<th scope="col" data-col="${key}" aria-sort="none"><button data-sort="${key}">${label}<span class="sort-arrow" aria-hidden="true"></span></button></th>`;}
function createLibrary(root) {
  const device = root.dataset.device;
  const state = {root,device,selected:new Set(),sort:'size',direction:-1,query:'',view:'table'};
  const navigation = [['house','Home'],['book-open','Books'],['folder','Folders'],['tag','Subjects'],['user','Authors'],['magnifying-glass','Search'],['pencil','Notes'],['buildings','Catalog'],['sidebar-simple','Split'],['gear','Settings']];
  root.innerHTML = `${device === 'desktop' ? `<aside class="rail" aria-label="Navigation preview"><span class="rail-item">${icon('books')}Library</span>${navigation.map(([glyph,label])=>`<span class="rail-item ${label==='Books'?'current':''}" ${label==='Books'?'aria-current="page"':''}>${icon(glyph)}${label}</span>`).join('')}</aside>` : ''}
    <div class="library">
      <header class="topbar"><div class="page-title">Books ${icon('caret-down')}</div><div class="topbar-actions"><button class="action toggle-search" aria-label="Search books" title="Search books" aria-expanded="false">${icon('magnifying-glass')}</button><div class="switch" aria-label="Library view"><button data-view="cards" aria-pressed="false" aria-label="Cards" title="Cards">${icon('squares-four')}<span class="switch-label">Cards</span></button><button data-view="table" aria-pressed="true" aria-label="Table" title="Table">${icon('table')}<span class="switch-label">Table</span></button></div><button class="action" aria-label="Add books" title="Add books">${icon('plus')}</button><button class="action" aria-label="Sort and filter" title="Sort & filter">${icon('sliders-horizontal')}</button></div></header>
      <div class="tools" hidden><label class="search">${icon('magnifying-glass')}<input type="search" aria-label="Search books in ${device} preview" placeholder="Search books"></label></div>
      <div class="selection" hidden role="status"><strong></strong><span class="selection-total"></span><button class="clear-selection">Clear</button></div>
      <div class="table-area"><table aria-label="Books in ${device} preview"><thead><tr><th class="check" scope="col"><label class="select-label"><input type="checkbox" class="select-all" aria-label="Select all visible books"></label></th>${header('title','Title')}${header('author','Author')}${header('format','Format')}${header('size','Size')}${header('progress','Read')}${header('available','Available')}</tr></thead><tbody></tbody></table></div>
      <div class="cards" hidden></div>
      <footer class="footer"><span class="result-count"></span><span class="result-size"></span></footer>
      <nav class="bottom-nav" aria-label="Navigation preview"><span>${icon('house')}Home</span><span class="current" aria-current="page">${icon('book-open')}Library</span><span>${icon('buildings')}Catalog</span><span>${icon('gear')}Settings</span><span>${icon('books')}My library</span></nav>
    </div>`;
  root.addEventListener('click', event => {
    const searchButton = event.target.closest('.toggle-search');
    if(searchButton) {const tools=root.querySelector('.tools');tools.hidden=!tools.hidden;searchButton.setAttribute('aria-expanded',String(!tools.hidden));if(!tools.hidden)tools.querySelector('input').focus();}
    const sortButton = event.target.closest('[data-sort]');
    if (sortButton) {const key=sortButton.dataset.sort; state.direction=state.sort===key ? -state.direction : (key==='size'||key==='progress' ? -1 : 1);state.sort=key;render(state);}
    const viewButton=event.target.closest('[data-view]');
    if (viewButton) {state.view=viewButton.dataset.view;render(state);}
    if (event.target.closest('.clear-selection')) {state.selected.clear();render(state);}
    const title=event.target.closest('[data-book]');
    if (title) openDetail(books.find(book=>book.id===Number(title.dataset.book)));
  });
  root.addEventListener('change',event=>{
    if (event.target.matches('[data-select]')) {const id=Number(event.target.dataset.select);event.target.checked?state.selected.add(id):state.selected.delete(id);render(state);}
    if (event.target.matches('.select-all')) {visible(state).forEach(book=>event.target.checked?state.selected.add(book.id):state.selected.delete(book.id));render(state);}
  });
  root.querySelector('input[type=search]').addEventListener('input',event=>{state.query=event.target.value;render(state);});
  render(state);
}
function visible(state) {
  const query=state.query.trim().toLocaleLowerCase();
  return books.filter(book=>`${book.title} ${book.author} ${book.format}`.toLocaleLowerCase().includes(query)).sort((a,b)=>{
    const key=state.sort;
    if(key==='size') {if(a.bytes===null) return b.bytes===null?0:1;if(b.bytes===null)return -1;return state.direction*(a.bytes-b.bytes);}
    if(key==='progress')return state.direction*(a.progress-b.progress);
    return state.direction*String(a[key]).localeCompare(String(b[key]));
  });
}
function render(state) {
  const {root,selected}=state,rows=visible(state);
  root.querySelector('tbody').innerHTML=rows.length?rows.map(book=>`<tr class="${selected.has(book.id)?'selected':''}"><td class="check"><label class="select-label"><input type="checkbox" data-select="${book.id}" aria-label="Select ${escape(book.title)}" ${selected.has(book.id)?'checked':''}></label></td><td><button class="title-button" data-book="${book.id}">${escape(book.title)}</button><div class="byline">${escape(book.author)}<span class="byline-format"> · ${book.format}</span></div></td><td class="book-author" data-col="author">${escape(book.author)}</td><td class="format" data-col="format">${book.format}</td><td class="size ${book.bytes===null?'unknown':''}" data-col="size" ${book.bytes===null?'aria-label="File size unknown" title="File size is not available"':`title="${book.bytes.toLocaleString('en')} bytes"`}>${size(book.bytes)}</td><td class="progress" data-col="progress">${book.progress===100?'Finished':book.progress?`${book.progress}%`:'Unread'}</td><td class="available" data-col="available"><span>${icon(book.available==='device'?'hard-drive':'cloud-download')}${book.available==='device'?'On device':'Cloud'}</span></td></tr>`).join(''):`<tr><td class="empty" colspan="7">No books match “${escape(state.query)}”.</td></tr>`;
  root.querySelector('.cards').innerHTML=rows.map(book=>`<button class="card-book" data-book="${book.id}"><span class="cover">${escape(book.title)}</span><span>${escape(book.title)}</span><small>${escape(book.author)}</small></button>`).join('');
  root.querySelectorAll('th[aria-sort]').forEach(th=>{const active=th.dataset.col===state.sort;th.setAttribute('aria-sort',active?(state.direction===1?'ascending':'descending'):'none');th.querySelector('.sort-arrow').textContent=active?(state.direction===1?'↑':'↓'):'';});
  const selection=root.querySelector('.selection'),chosen=books.filter(book=>selected.has(book.id));
  selection.hidden=chosen.length===0;
  selection.querySelector('strong').textContent=`${chosen.length} selected`;
  selection.querySelector('.selection-total').textContent=`· ${totalLabel(chosen)}`;
  const checkbox=root.querySelector('.select-all'),visibleSelected=rows.filter(book=>selected.has(book.id)).length;
  checkbox.checked=rows.length>0&&visibleSelected===rows.length;checkbox.indeterminate=visibleSelected>0&&visibleSelected<rows.length;checkbox.disabled=rows.length===0;
  root.querySelector('.result-count').textContent=`${rows.length} ${rows.length===1?'book':'books'}`;
  root.querySelector('.result-size').textContent=totalLabel(rows);
  root.querySelector('.table-area').hidden=state.view!=='table';root.querySelector('.cards').hidden=state.view!=='cards';
  root.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===state.view)));
}
const dialog=document.getElementById('book-detail');
document.getElementById('close-detail').innerHTML=icon('x');
document.getElementById('close-detail').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)dialog.close();}});
function openDetail(book) {
  document.getElementById('detail-title').textContent=book.title;
  dialog.querySelector('.detail-author').textContent=book.author;
  const facts=[['Format',book.format],[book.format==='Audio'?'Audio files':'File size',book.bytes===null?'Not available':size(book.bytes)],['Available',book.available==='device'?'On device':'Cloud']];
  if(book.year)facts.push(['Published',book.year]);
  dialog.querySelector('dl').innerHTML=facts.map(([label,value])=>`<dt>${label}</dt><dd>${escape(value)}</dd>`).join('');
  dialog.showModal();
}
document.querySelectorAll('.app').forEach(createLibrary);
</script>
</body>
</html>
