[package]
name = "html-publication"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
encoding_rs.workspace = true
epub_provider = { path = "../../epub_provider" }
html.workspace = true
mobi.workspace = true
percent-encoding = "2"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip.workspace = true

[dev-dependencies]
tempfile = "3"
