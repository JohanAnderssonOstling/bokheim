[package]
name = "pdf-reader-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
# Load PDFium from an immutable application package instead of embedding the
# shared library in the Rust executable. Intended for Flatpak builds, where the
# manifest installs libpdfium.so below /app/lib.
packaged-pdfium = []

[dependencies]
image = { version = "0.25", default-features = false }
pdf-view-common = { path = "../view-common" }
pdfium-render = { workspace = true, features = ["pdfium_latest", "thread_safe"] }
reader-style = { path = "../../shared/reader-style" }

[build-dependencies]
flate2 = "1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
ureq = "3"
