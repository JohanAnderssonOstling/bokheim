<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
        <title>Bokheim</title>
        <script type="module">
            import initialize from "./pkg/web_gpui.js";

            try {
                await initialize();
            } catch (error) {
                console.error("Failed to start Bokheim", error);
                const message = document.createElement("pre");
                message.id = "startup-error";
                message.textContent = `Failed to start Bokheim\n\n${error?.stack ?? error}`;
                document.body.append(message);
            }
        </script>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
                user-select: none;
            }
        </style>
    </head>
    <body></body>
</html>
