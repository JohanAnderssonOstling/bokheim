[package]
name = "web-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
app-contract = { path = "../../client/app-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
library-model = { path = "../../client/library-model" }
sync-common = { path = "../../shared/sync-common" }

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2"
browser-ui = { path = "../ui/gpui/browser", default-features = false }
bokheim-web-core = { path = "../mobile/web-core" }
console_error_panic_hook = "0.1"
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
log = "0.4"
reader-ui = { path = "../ui/gpui/reader", default-features = false }
ui-components = { path = "../ui/gpui/components" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
