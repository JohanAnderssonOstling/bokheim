[package]
name = "web-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bokheim-backend = { path = "../../client/backend", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
browser-ui = { path = "../ui/gpui/browser", default-features = false }
console_error_panic_hook = "0.1"
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
log = "0.4"
reader-ui = { path = "../ui/gpui/reader", default-features = false }
ui-components = { path = "../ui/gpui/components" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
