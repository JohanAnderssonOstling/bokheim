[package]
name = "ui-components"
version = "0.1.0"
edition = "2024"

[features]
default = []
kobo = ["mobile", "dep:gpui_kobo", "dep:kobo-profile"]
mobile = []

[dependencies]
html-pipeline = { package = "skrift-pipeline", path = "../../../HtmlEngine/crates/html-pipeline" }
html-style-model = { package = "skrift-style-model", path = "../../../HtmlEngine/crates/html-style-model" }
ui-text = { path = "../ui-text" }
book-model = { path = "../../shared/book-model", default-features = false }
kobo-profile = { path = "../../client/platforms/kobo/crates/profile", optional = true }
log = "0.4"
web-time = "1"
library-model = { path = "../../client/library-model", default-features = false }
operation-failure = { path = "../../client/client-protocol/crates/operation-failure" }
path-label = { path = "../../client/ui/path-label" }
app-preferences = { path = "../../client/preferences" }
gpui.workspace = true
html.workspace = true
html-gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_kobo = { workspace = true, optional = true }
unicode-normalization.workspace = true

# Configure GPUI's shared decoder dependencies explicitly instead of enabling
# its broad image-formats feature. Keep the same UI formats on every platform,
# including raster images embedded inside SVGs.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
resvg = { version = "0.46", default-features = false, features = ["raster-images"] }

[dev-dependencies]
html-engine-model = { package = "skrift-engine-model", path = "../../../HtmlEngine/crates/html-engine-model" }
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"] }

[package.metadata.cargo-machete]
ignored = ["image", "resvg"]
