[package]
name = "sync-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sync-common = { path = "../SyncCommon" }
urlencoding = "2"
blake3 = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.4", features = ["util"] }
