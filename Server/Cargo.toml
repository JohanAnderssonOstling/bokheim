[package]
name = "sync-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    ".",
    "crates/server-core",
    "crates/server-postgres",
    "crates/server-asset-store",
    "crates/server-http",
]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
private_interfaces = "deny"

[lints]
workspace = true

[dependencies]
axum = "0.7"
axum-server = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
server-core = { path = "crates/server-core" }
server-postgres = { path = "crates/server-postgres" }
server-asset-store = { path = "crates/server-asset-store" }
server-http = { path = "crates/server-http" }
sync-common = { path = "../SyncCommon" }
serde_json = "1"
url = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
