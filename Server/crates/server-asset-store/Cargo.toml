[package]
name = "server-asset-store"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
blake3 = "1"
book-format = { path = "../../../BookFormat" }
image = { version = "0.24.9", default-features = false, features = ["png"] }
server-core = { path = "../server-core" }
sync-common = { path = "../../../SyncCommon" }
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
