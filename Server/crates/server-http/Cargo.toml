[package]
name = "server-http"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
server-core = { path = "../server-core" }
sync-common = { path = "../../../SyncCommon" }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
