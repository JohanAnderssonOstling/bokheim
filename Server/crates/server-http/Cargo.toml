[package]
name = "server-http"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.7", features = ["ws"] }
bokheim-app-contract = { path = "../../../BokheimAppContract" }
bokheim-wire = { path = "../../../BokheimWire" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
server-account-core = { path = "../server-account-core" }
server-core = { path = "../server-core" }
server-wire-http = { path = "../server-wire-http" }
sync-common = { path = "../../../SyncCommon" }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"
