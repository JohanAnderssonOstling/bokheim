[package]
name = "server-postgres"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
serde_json = "1"
server-core = { path = "../server-core" }
sha2 = "0.10"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
sync-common = { path = "../../../SyncCommon" }
tracing = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
