[package]
name = "server-postgres"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
server-core = { path = "../server-core" }
server-asset-store = { path = "../server-asset-store" }
server-database = { path = "../server-database" }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "migrate"] }
serde = { version = "1", features = ["derive"] }
sync-common = { path = "../../../SyncCommon" }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
