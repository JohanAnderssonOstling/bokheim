[package]
name = "epub-svelte"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "epub_svelte_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[test]]
name = "scan"
path = "tests/scan.rs"

[[test]]
name = "blake3_hash_benchmark"
path = "tests/blake3_hash_benchmark.rs"

[features]
default = ["desktop"]
desktop = ["watcher", "pdf"]
scanner = []
watcher = ["scanner", "dep:notify"]
pdf = ["dep:pdf-reader-core", "thumbnail/pdf"]
mobile = []

[dependencies]
book-metadata = { package = "book-metadata", path = "crates/book-metadata" }
bokheim-library-files = { path = "../BokheimLibraryFiles" }
library-registry = { package = "library-registry", path = "crates/library-registry" }
remote-reader = { package = "remote-reader", path = "crates/remote-reader" }
bokheim-app-contract = { path = "../BokheimAppContract" }
bokheim-catalog = { path = "../BokheimCatalogProvider" }
bokheim-domain = { path = "../BokheimDomain" }
bokheim-opds = { path = "../BokheimOpds" }
bokheim-sync-client = { path = "../BokheimSyncClient" }
projection = { package = "projection", path = "crates/projection" }
storage-sqlite = { package = "storage-sqlite", path = "crates/storage-sqlite" }
thumbnail = { package = "thumbnail", path = "crates/thumbnail" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = {version = "0.37.0", features = ["bundled", "functions"] }
include-sqlite-sql = "0.2.1"
walkdir = "2.5.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
notify = { version = "6.1", optional = true }
futures-util = "0.3"
html-publication = { path = "../HtmlRenderer/crates/html-publication" }
crossbeam-channel = "0.5"
sync-common = { path = "../SyncCommon" }
urlencoding = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
blake3 = "1"
pdf-reader-core = { path = "../PdfRenderer", optional = true }
dirs = "6"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
[dev-dependencies]
axum = "0.7"
epub_provider = { path = "../HtmlRenderer/epub_provider" }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.44", default-features = false }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tempfile = "3"
zip = "2.4.2"
