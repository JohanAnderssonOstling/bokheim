[package]
name = "browser-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
bokheim-ui-runtime = { path = "../bokheim-ui-runtime" }
bokheim-ui-components = { path = "../bokheim-ui-components" }
epub_svelte_lib = { package = "epub-svelte", path = "../../Backend" }
gpui.workspace = true
gpui-component.workspace = true
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
