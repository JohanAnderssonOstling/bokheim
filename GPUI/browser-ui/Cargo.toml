[package]
name = "browser-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop-backend"]
desktop-backend = ["epub_svelte_lib/desktop"]
kobo = ["dep:gpui_kobo"]

[dependencies]
bokheim-ui-runtime = { path = "../bokheim-ui-runtime" }
bokheim-ui-components = { path = "../bokheim-ui-components" }
epub_svelte_lib = { package = "epub-svelte", path = "../../crates/backend", default-features = false }
gpui.workspace = true
gpui-component.workspace = true
gpui_kobo = { path = "../../../GPUI-Fork/crates/gpui_kobo", optional = true }
html.workspace = true
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
