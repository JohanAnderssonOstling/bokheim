[package]
name = "bokheim-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
bokheim-ui-runtime = { path = "../bokheim-ui-runtime" }
browser-ui = { path = "../browser-ui" }
epub_svelte_lib = { package = "epub-svelte", path = "../../Backend" }
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_platform.workspace = true
log = "0.4"
reader-ui = { path = "../reader-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
