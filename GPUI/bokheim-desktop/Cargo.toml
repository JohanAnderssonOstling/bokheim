[package]
name = "bokheim-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
audiobooks = ["dep:audiobook-player", "reader-ui/audiobooks"]
desktop = [
    "audiobooks",
    "dep:gpui_platform",
    "epub_svelte_lib/desktop",
    "browser-ui/desktop-backend",
    "reader-ui/desktop-backend",
    "reader-ui/native-audio",
    "reader-ui/pdf",
]
kobo = ["dep:gpui_kobo", "dep:kobo-device", "epub_svelte_lib/scanner", "browser-ui/kobo", "reader-ui/kobo"]

[[bin]]
name = "bokheim-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "bokheim-kobo"
path = "src/bin/bokheim-kobo.rs"
required-features = ["kobo"]

[dependencies]
async-channel = "2"
audiobook-player = { path = "../audiobook-player", optional = true }
bokheim-ui-runtime = { path = "../bokheim-ui-runtime" }
bokheim-ui-components = { path = "../bokheim-ui-components" }
browser-ui = { path = "../browser-ui", default-features = false }
epub_svelte_lib = { package = "epub-svelte", path = "../../crates/backend", default-features = false }
gpui.workspace = true
gpui-component.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui_kobo = { path = "../../../GPUI-Fork/crates/gpui_kobo", optional = true }
kobo-device = { path = "../kobo-device", optional = true }
log = "0.4"
reader-ui = { path = "../reader-ui", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
