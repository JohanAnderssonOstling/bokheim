[package]
name = "reader-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
bokheim-ui-runtime = { path = "../bokheim-ui-runtime" }
bokheim-ui-components = { path = "../bokheim-ui-components" }
epub_svelte_lib = { package = "epub-svelte", path = "../../Backend" }
gpui.workspace = true
gpui-component.workspace = true
html-view-core = { path = "../../HtmlRenderer/crates/html-view-core" }
html-view-gpui = { path = "../../HtmlRenderer/crates/html-view-gpui" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
reader-style = { path = "../../ReaderStyle" }
pdf-reader-core = { path = "../../PdfRenderer" }
pdf-view-gpui = { path = "../pdf-view-gpui" }
