[package]
name = "audiobook-player"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "m4b-metadata-probe"
path = "src/bin/m4b_metadata_probe.rs"

[dependencies]
audiobook-library = { path = "../../crates/audiobook-library" }
bokheim-ui-components = { path = "../bokheim-ui-components" }
gpui.workspace = true
gpui-component.workspace = true
crossbeam-channel = "0.5"
mp4ameta = "0.13.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4", "symphonia-alac"] }
wsola = "0.1.0"
