[package]
name = "book-inspection"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
pdf-range-reader = { path = "../../../../shared/pdf-range-reader" }
pdf-reader-core = { path = "../../../../shared/pdf-reader-core" }
metadata-contract = { path = "../../../../shared/metadata-contract" }
book-content = { path = "../../../book-content" }
lopdf = { version = "0.44", default-features = false }
book-model = { path = "../../../../shared/book-model" }
roxmltree = "0.20"
regex = "1"
quick-xml = "0.31"
subject-projection = { path = "../../../../shared/subject-projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
audiobook-archive = { path = "../../../../shared/audiobook-archive" }
audiobook-folder = { path = "../audiobook-folder" }
content-address = { path = "../../../../shared/content-address" }
pdf-view-common = { path = "../../../../shared/pdf-view-common" }
mp4ameta = { version = "0.13.0" }
zip.workspace = true
encoding_rs = "0.8"
log = "0.4"
blake3.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
mobi = { workspace = true }
tempfile = "3"
