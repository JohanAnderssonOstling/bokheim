[package]
name = "library-opds"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
uuid = { version = "1", features = ["v4", "js"] }
book-model = { path = "../../../../shared/book-model" }
http-response = { workspace = true }
client-platform-runtime = { path = "../../../platforms/runtime" }
client-runtime = { path = "../../../client-runtime", features = ["http"] }
blake3 = { workspace = true }
image = { workspace = true }
thumbnail = { path = "../thumbnail" }
library-model = { path = "../../../library-model" }
reqwest = { workspace = true }
roxmltree = "0.20"
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
embedded-browser = { path = "../../../embedded-browser" }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
