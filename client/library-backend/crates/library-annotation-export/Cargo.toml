[package]
name = "library-annotation-export"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
operation-failure = { path = "../../../client-protocol/crates/operation-failure" }
book-model = { path = "../../../../shared/book-model" }
content-address = { path = "../../../../shared/content-address" }
library-model = { path = "../../../library-model" }
reader-interop = { path = "../../../reader-interop" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-lite = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sync-common = { path = "../../../../shared/sync-common" }
blake3.workspace = true
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
library-database = { path = "../library-database" }
library-files = { path = "../library-files" }
book-inspection = { path = "../book-inspection" }
book-content = { path = "../../../book-content" }
client-platform-runtime = { path = "../../../platforms/runtime" }
client-platform-native = { path = "../../../platforms/native" }
tempfile = "3"
md-5 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
lopdf = { version = "0.44", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
library-replica = { path = "../library-replica" }
zip.workspace = true
