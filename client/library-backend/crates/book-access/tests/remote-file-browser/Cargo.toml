[package]
name = "remote-file-browser-test"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "lib.rs"
crate-type = ["cdylib"]
[dependencies]
book-access = { path = "../.." }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WorkerGlobalScope"] }
reqwest = { version = "0.12.28", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "macros"] }
book-content = { path = "../../../../../book-content" }

# Match the application’s vendored container and browser PDF patches.
[patch.crates-io]
mobi = { path = "../../../../../../vendor/mobi" }
async_zip = { path = "../../../../../../vendor/async_zip" }
zip = { path = "../../../../../../vendor/zip" }
pdfium-render = { path = "../../../../../../vendor/pdfium-render" }
