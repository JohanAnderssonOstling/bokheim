[package]
name = "book-access"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
pdf = []

[dependencies]
book-content = { path = "../../../book-content" }
http-response = { path = "../../../../shared/http-response" }
client-platform-runtime = { path = "../../../platforms/runtime" }
operation-failure = { path = "../../../client-protocol/crates/operation-failure", features = ["http"] }
sync-common = { path = "../../../../shared/sync-common" }
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", features = ["io"] }
async-channel = "2"
futures-channel = "0.3"
sync_wrapper = "1"
mime = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-util = { version = "0.7", features = ["io-util", "compat"] }
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }
reqwest = { workspace = true, features = ["stream"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "0.7"
server-asset-store = { path = "../../../../servers/sync/crates/server-asset-store" }
zip.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
