[package]
name = "cpu-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cpu-contract = { path = "../../../cpu-contract" }
html-parse = { package = "skrift-parse", path = "../../../../../HtmlEngine/crates/02-html-parse" }
content-address = { path = "../../../../shared/content-address" }
book-model = { path = "../../../../shared/book-model" }
device-sqlite = { path = "../../../platforms/sqlite" }
book-content = { path = "../../../book-content" }
pdf-reader-core = { path = "../../../../shared/pdf-reader-core" }
book-inspection = { path = "../book-inspection" }
thumbnail = { path = "../thumbnail" }
client-platform-runtime = { path = "../../../platforms/runtime" }
blake3 = "1"

image = { workspace = true, features = ["jpeg", "png"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
serde_bytes = "0.11"
