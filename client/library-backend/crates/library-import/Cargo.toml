[package]
name = "library-import"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
book-inspection = { path = "../book-inspection" }
book-model = { path = "../../../../shared/book-model" }
metadata-contract = { path = "../../../../shared/metadata-contract" }
client-platform-runtime = { path = "../../../platforms/runtime" }
client-protocol = { path = "../../../client-protocol" }
library-catalog = { path = "../library-catalog" }
cpu-host = { path = "../cpu-host" }
blake3 = "1"
content-address = { path = "../../../../shared/content-address" }
library-database = { path = "../library-database" }
library-files = { path = "../library-files" }
library-model = { path = "../../../library-model" }
reader-interop = { path = "../../../reader-interop" }
library-placement = { path = "../library-placement" }
library-replica = { path = "../library-replica" }
library-services = { path = "../library-services" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "v5"] }
sync-common = { path = "../../../../shared/sync-common" }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-lite = "2"
dirs = "6"
book-content = { path = "../../../book-content" }
md-5 = "0.10.6"
url = "2"
client-platform-native = { path = "../../../platforms/native" }
filesystem-scanner = { path = "../filesystem-scanner" }
tokio = { version = "1", features = ["fs", "io-util"] }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }
getrandom = { version = "0.3", features = ["wasm_js"] }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
library-annotation-export = { path = "../library-annotation-export" }
zip.workspace = true
audiobook-folder = { path = "../audiobook-folder" }
url = "2"
library-database = { path = "../library-database", features = ["scanner"] }
thumbnail = { path = "../thumbnail" }
image = { workspace = true, features = ["jpeg", "png"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
