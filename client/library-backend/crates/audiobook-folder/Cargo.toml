[package]
name = "audiobook-folder"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
audiobook-archive = { path = "../../../../shared/audiobook-archive" }
blake3 = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
zip.workspace = true
