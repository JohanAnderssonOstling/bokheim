[package]
name = "library-backend"
version = "0.1.0"
edition = "2021"
publish = false

[features]
app-integration-tests = []
default = ["desktop"]
desktop = ["watcher"]
scanner = ["dep:walkdir", "dep:crossbeam-channel", "library-database/scanner"]
watcher = ["scanner", "dep:notify"]
kobo = ["client-platform-kobo/device", "app-preferences/kobo"]

[dependencies]
account-contract = { path = "../../shared/account-contract" }
content-address = { path = "../../shared/content-address" }
app-preferences = { path = "../preferences", features = ["store"] }
library-registry = { path = "../app/crates/library-registry" }
http-response = { workspace = true }
client-runtime = { path = "../client-runtime", features = ["http"] }
book-model = { path = "../../shared/book-model" }
metadata-contract = { path = "../../shared/metadata-contract" }
library-files = { path = "crates/library-files" }
client-platform-runtime = { path = "../platforms/runtime" }
book-access = { path = "crates/book-access", features = ["pdf"] }
book-content = { path = "../book-content" }
pdf-view-common = { path = "../../shared/pdf-view-common" }
book-inspection = { path = "crates/book-inspection" }
cpu-host = { path = "crates/cpu-host" }
asset-transfer = { path = "crates/asset-transfer" }
library-import = { path = "crates/library-import" }
library-annotation-export = { path = "crates/library-annotation-export" }
library-catalog = { path = "crates/library-catalog" }
library-enrichment = { path = "crates/library-enrichment" }
library-placement = { path = "crates/library-placement" }
library-model = { path = "../library-model" }
library-runtime = { path = "crates/library-runtime" }
library-database = { path = "crates/library-database" }
account-client = { path = "../account-client" }
library-sync = { path = "crates/library-sync" }
sync-transport = { path = "crates/sync-transport" }
thumbnail = { path = "crates/thumbnail" }
log = "0.4"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled", "functions"] }
uuid = { version = "1.0", features = ["v4", "v5"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", features = ["io"] }
async-channel = "2"
sync-common = { path = "../../shared/sync-common" }
blake3 = "1"
serde_bytes = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../platforms/web" }
getrandom = { version = "0.3", features = ["wasm_js"] }
reqwest = { workspace = true, features = ["json", "stream"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Event", "EventTarget", "File", "DedicatedWorkerGlobalScope", "MessageChannel", "MessageEvent", "MessageEventInit", "MessagePort", "SharedWorker", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
embedded-browser = { path = "../embedded-browser" }
library-opds = { path = "crates/library-opds" }
filesystem-scanner = { path = "crates/filesystem-scanner" }
client-platform-native = { path = "../platforms/native", features = ["websocket"] }
client-platform-kobo = { path = "../platforms/kobo" }
tempfile = "3"
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
notify = { version = "6.1", optional = true }
walkdir = { version = "2.5", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
rmp-serde = "1.3"
wasm-bindgen-futures = "0.4"
audiobook-archive = { path = "../../shared/audiobook-archive" }
audiobook-folder = { path = "crates/audiobook-folder" }
image = { workspace = true, features = ["png"] }
library-database = { path = "crates/library-database" }
library-replica = { path = "crates/library-replica" }
lopdf = { version = "0.44", default-features = false }
tempfile = "3"

[[example]]
name = "epub_opening_checks"
crate-type = ["cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
