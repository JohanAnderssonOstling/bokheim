[package]
name = "library-backend"
version = "0.1.0"
edition = "2021"
publish = false

[features]
storage-contract-tests = []
web-runtime-tests = ["client-platform-web/web-runtime-tests", "book-access/web-runtime-tests", "client-platform-runtime/web-runtime-tests"]
app-integration-tests = []
default = ["desktop"]
desktop = ["watcher"]
scanner = ["dep:walkdir", "dep:crossbeam-channel", "library-database/scanner"]
watcher = ["scanner", "dep:notify"]
kobo = ["client-platform-kobo/device"]

[dependencies]
book-model = { path = "../../shared/book-model" }
catalog-model = { path = "../../shared/catalog-model" }
library-files = { path = "../library-files" }
client-platform-runtime = { path = "../platforms/runtime" }
book-access = { path = "../book-access", features = ["pdf"] }
pdf-view-common = { path = "../../apps/reader/crates/pdf/view-common" }
book-enrichment = { path = "../../shared/book-enrichment" }
book-inspection = { path = "../../shared/book-inspection" }
book-identity = { path = "../../shared/book-identity" }
book-metadata = { path = "../book-metadata" }
asset-transfer = { path = "../sync/asset-transfer" }
metadata-client = { path = "crates/metadata-client" }
library-model = { path = "../library-model" }
client-library = { path = "../library", default-features = false, features = ["audiobook-metadata", "scanner"] }
library-runtime = { path = "../library-runtime" }
library-database = { path = "../library-database" }
metadata-contract = { path = "../../shared/metadata-contract" }
subject-projection = { path = "../../shared/subject-projection" }
library-replica = { path = "../library-replica" }
account-client = { path = "../account-client" }
sync-engine = { path = "crates/sync-engine" }
sync-transport = { path = "../sync/transport" }
thumbnail = { path = "../thumbnail" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled", "functions", "hooks"] }
web-time = "1"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", features = ["io"] }
async-channel = "2"
sync-common = { path = "../../shared/sync-common" }
blake3 = "1"
rmp-serde = "1.3"
serde_bytes = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../platforms/web" }
futures-channel = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Event", "EventTarget", "File", "DedicatedWorkerGlobalScope", "MessageChannel", "MessageEvent", "MessageEventInit", "MessagePort", "SharedWorker", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../platforms/native", features = ["websocket"] }
client-platform-kobo = { path = "../platforms/kobo" }
book-identity = { path = "../../shared/book-identity", features = ["native-write"] }
tempfile = "3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
notify = { version = "6.1", optional = true }
walkdir = { version = "2.5", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
test-support = { path = "../test-support", features = ["pdf-fixtures"] }
account-contract = { path = "../../shared/account-contract" }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.44", default-features = false }
tempfile = "3"
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
tokio = { version = "1.0", features = ["test-util"] }
axum = "0.7"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
