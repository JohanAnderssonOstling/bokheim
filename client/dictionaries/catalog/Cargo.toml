[package]
name = "dictionary-catalog"
version = "0.1.0"
edition = "2024"
publish = false

[features]
download = ["dep:http-response", "dep:reqwest", "dep:futures-util"]

[dependencies]
http-response = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { workspace = true, features = ["stream"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
