[package]
name = "app-preferences"
version = "0.1.0"
edition = "2021"
publish = false

[features]
kobo = []
store = ["dep:client-platform-runtime", "dep:serde_json", "dep:tokio", "dep:log", "dep:dirs"]

[dependencies]
ui-text = { path = "../../apps/ui-text" }
serde = { version = "1", features = ["derive"] }
client-platform-runtime = { path = "../platforms/runtime", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { version = "6", optional = true }

[dev-dependencies]
serde_json = "1"
