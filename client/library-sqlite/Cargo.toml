[package]
name = "library-sqlite"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["audiobook-metadata"]
audiobook-metadata = ["dep:book-metadata", "book-metadata/native-formats"]
scanner = []

[dependencies]
book-metadata = { path = "../book-metadata", default-features = false, optional = true }
catalog-model = { path = "../../shared/catalog-model" }
include-sqlite-sql = "0.2.1"
library-model = { path = "../library-model", default-features = false }
library-replica = { path = "../library-replica", default-features = false }
log = "0.4"
metadata-contract = { path = "../../shared/metadata-contract" }
rusqlite = { version = "0.40.0", features = ["functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subject-projection = { path = "../../shared/subject-projection" }
sync-common = { path = "../../shared/sync-common", default-features = false }
taxonomy-contract = { path = "../../shared/taxonomy-contract" }
uuid = { version = "1", default-features = false, features = ["serde", "v4", "js"] }
web-time = "1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile = "3"
