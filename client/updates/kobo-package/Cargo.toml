[package]
name = "kobo-package"
version = "0.1.0"
edition = "2024"
publish = false

# Explicit dependencies also allow use from the standalone USB installer.
[dependencies]
operation-failure = { path = "../../client-protocol/crates/operation-failure" }
kobo-profile = { path = "../../platforms/kobo/crates/profile" }
flate2 = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
update-protocol = { path = "../../../shared/update-protocol" }
update-files = { path = "../../../shared/update-files" }
