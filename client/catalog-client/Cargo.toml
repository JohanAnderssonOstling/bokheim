[package]
name = "catalog-client"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
catalog-contract = { path = "../../shared/catalog-contract" }
catalog-core = { path = "../../shared/catalog-core" }
opds = { path = "../../shared/opds" }
wire = { package = "protobuf-wire", path = "../../shared/protobuf-wire" }
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tempfile = "3"
url = "2"

[dev-dependencies]
axum = "0.7"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
