[package]
name = "catalog-client"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
catalog-model = { path = "../../shared/catalog-model" }
catalog-core = { path = "../../shared/catalog-core" }
device-sqlite = { path = "../device-sqlite" }
wire = { package = "protobuf-wire", path = "../../shared/protobuf-wire" }
futures-util = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["stream"] }
rusqlite = "0.40.0"
serde = "1"
tokio = { version = "1", features = ["time"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "rustls-tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net"] }
axum = "0.7"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
