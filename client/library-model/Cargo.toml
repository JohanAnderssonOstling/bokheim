[package]
name = "library-model"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["random-ids"]
random-ids = ["uuid/v4"]
authoritative-taxonomy = ["subject-projection/authoritative-taxonomy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
catalog-model = { path = "../../shared/catalog-model" }
content-address = { path = "../../shared/content-address" }
publication-model = { path = "../../shared/publication-model" }
subject-projection = { path = "../../shared/subject-projection" }
unicode-normalization.workspace = true
uuid = { version = "1", features = ["v5", "serde"] }

[dev-dependencies]
wire = { path = "../../shared/wire" }
serde_json = "1"
tempfile = "3"
