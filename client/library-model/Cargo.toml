[package]
name = "library-model"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["random-ids"]
random-ids = ["uuid/v4"]

[dependencies]
serde = { version = "1", features = ["derive"] }
csv = "1.3.1"
catalog-model = { path = "../../shared/catalog-model" }
content-address = { path = "../../shared/content-address" }
unicode-normalization.workspace = true
uuid = { version = "1", features = ["v5", "serde"] }

[dev-dependencies]
wire = { path = "../../shared/wire" }
serde_json = "1"
