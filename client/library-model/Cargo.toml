[package]
name = "library-model"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["random-ids"]
random-ids = ["uuid/v4", "book-model/random-ids"]

[dependencies]
ui-text = { path = "../../apps/ui-text" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
url = "2"
operation-failure = { path = "../operation-failure" }
content-address = { path = "../../shared/content-address" }
book-model = { path = "../../shared/book-model", default-features = false }
uuid = { version = "1", features = ["v5", "serde"] }

pdf-view-common = { path = "../../shared/pdf-view-common" }
