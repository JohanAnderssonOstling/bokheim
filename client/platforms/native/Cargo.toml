[package]
name = "client-platform-native"
version = "0.1.0"
edition = "2021"

[features]
websocket = ["dep:tokio-tungstenite", "dep:rustls", "dep:tokio", "dep:futures-util"]

[dependencies]
client-platform-runtime = { path = "../runtime" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }
rustls = { workspace = true, optional = true }
tokio = { version = "1", features = ["net"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
tempfile = "3"
blake3 = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
