[package]
name = "library-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
account-client = { path = "../account-client" }
asset-transfer = { path = "../sync/asset-transfer" }
async-channel = "2"
client-platform-runtime = { path = "../platforms/runtime" }
device-sqlite = { path = "../device-sqlite" }
library-model = { path = "../library-model", default-features = false }
client-library = { path = "../library", default-features = false }
library-replica = { path = "../library-replica", default-features = false }
library-files = { path = "../library-files" }
sync-common = { path = "../../shared/sync-common", default-features = false }
sync-transport = { path = "../sync/transport" }
tokio = { version = "1", features = ["sync"] }
web-time = "1"
uuid = { version = "1.0", features = ["v4"] }
rusqlite = { version = "0.40.0", features = ["bundled", "functions", "hooks"] }
log = "0.4"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../platforms/web" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../platforms/native" }
