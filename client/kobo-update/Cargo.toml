[package]
name = "kobo-update"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fs2 = "0.4"
kobo-package = { path = "../../shared/kobo-package" }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
update-protocol = { path = "../../shared/update-protocol" }
update-files = { path = "../../shared/update-files" }

[dev-dependencies]
tempfile = "3"
flate2 = "1"
tar = "0.4"
