[package]
name = "update-client"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
blocking = ["reqwest/blocking"]
native-state = ["blocking", "dep:rusqlite", "dep:fs2", "dep:zip"]

[dependencies]
client-platform-runtime = { path = "../platforms/runtime" }
ring = "0.17"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
update-protocol = { path = "../../shared/update-protocol" }
update-files = { path = "../../shared/update-files" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40.0", features = ["bundled", "backup"], optional = true }
fs2 = { version = "0.4", optional = true }
zip = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "gzip", "zstd"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
reqwest = { workspace = true, default-features = false }

[dev-dependencies]
tempfile = "3"
