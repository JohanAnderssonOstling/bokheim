[package]
name = "remote-reader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sync-client = { path = "../sync-client" }
sync-common = { path = "../../shared/sync-common" }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
test-support = { path = "../test-support" }

[lints]
workspace = true
