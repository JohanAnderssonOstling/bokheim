[package]
name = "thumbnail"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["publication-extractors"]
pdf = ["dep:pdf-reader-core"]
publication-memory = ["dep:epub_provider", "dep:mobi", "dep:resvg"]
publication-extractors = ["publication-memory", "dep:mp4ameta"]

[dependencies]
epub_provider = { path = "../../apps/renderers/html/epub_provider", optional = true }
fast_image_resize = { version = "5.2.0", features = ["image"] }
image = { version = "0.24.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
mobi = { workspace = true, optional = true }
mp4ameta = { version = "0.13.0", optional = true }
pdf-reader-core = { path = "../../apps/renderers/pdf/core", optional = true }
resvg = { version = "0.46.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
zip.workspace = true
