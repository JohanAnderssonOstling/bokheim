[package]
name = "book-metadata"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["native-formats", "external-metadata"]
native-formats = [
    "dep:audiobook-library",
    "dep:mobi",
    "dep:mp4ameta",
]
external-metadata = [
    "dep:reqwest",
    "dep:roxmltree",
    "dep:tokio",
]

[dependencies]
audiobook-library = { path = "../audiobook-library", optional = true }
library-model = { path = "../library-model" }
publication-inspection = { path = "../../shared/publication-inspection" }
mobi = { workspace = true, optional = true }
mp4ameta = { version = "0.13.0", optional = true }
reqwest = { version = "0.11", default-features = false, features = ["stream"], optional = true }
roxmltree = { version = "0.20", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"], optional = true }

[lints]
workspace = true
