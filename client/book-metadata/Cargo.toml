[package]
name = "book-metadata"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pdf-reader-core = { path = "../../apps/reader/crates/pdf/core" }
pdf-view-common = { path = "../../apps/reader/crates/pdf/view-common" }
metadata-contract = { path = "../../shared/metadata-contract" }
audiobook-library = { path = "../audiobook-library" }
library-model = { path = "../library-model" }
publication-inspection = { path = "../../shared/publication-inspection", features = ["mobi"] }
mobi = { workspace = true }
mp4ameta = { version = "0.13.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "survey_titles"
