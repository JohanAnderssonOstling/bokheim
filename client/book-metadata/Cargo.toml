[package]
name = "book-metadata"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["native-formats"]
native-formats = [
    "publication-inspection/mobi",
    "dep:audiobook-library",
    "dep:mobi",
    "dep:mp4ameta",
]

[dependencies]
pdf-reader-core = { path = "../../apps/reader/crates/pdf/core" }
pdf-view-common = { path = "../../apps/reader/crates/pdf/view-common" }
metadata-contract = { path = "../../shared/metadata-contract" }
audiobook-library = { path = "../audiobook-library", optional = true }
library-model = { path = "../library-model" }
publication-inspection = { path = "../../shared/publication-inspection" }
mobi = { workspace = true, optional = true }
mp4ameta = { version = "0.13.0", optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "survey_titles"
required-features = ["native-formats"]
