[package]
name = "taxonomy-client"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
log = "0.4"
publication-model = { path = "../../shared/publication-model" }
subject-projection = { path = "../../shared/subject-projection" }
reqwest = { version = "0.11", default-features = false, features = ["json"] }
rusqlite = "0.40.0"
serde_json = "1"
taxonomy-contract = { path = "../../shared/taxonomy-contract" }
tokio = { version = "1", features = ["time"] }
url = "2"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
