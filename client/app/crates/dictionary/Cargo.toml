[package]
name = "dictionary"
version = "0.1.0"
edition = "2024"
publish = false

[features]
client = ["dep:dictionary-catalog", "dep:tokio"]
store = ["client", "dictionary-catalog/download", "dep:client-platform-runtime", "tokio/rt", "dep:uuid", "dep:log"]

[dependencies]
dictionary-catalog = { path = "../../../../shared/dictionary-catalog", optional = true }
client-platform-runtime = { path = "../../../platforms/runtime", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
log = { version = "0.4", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
scraper.workspace = true
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
zip.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
