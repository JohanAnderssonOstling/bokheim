[package]
name = "epub-svelte"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "epub_svelte_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[test]]
name = "scan"
path = "tests/scan.rs"

[[test]]
name = "blake3_hash_benchmark"
path = "tests/blake3_hash_benchmark.rs"

[features]
default = ["desktop"]
desktop = ["watcher", "pdf"]
scanner = []
watcher = ["scanner", "dep:notify"]
pdf = ["dep:pdf-reader-core", "thumbnail/pdf"]
mobile = []

[dependencies]
book-metadata = { path = "../book-metadata" }
library-registry = { path = "../library-registry" }
remote-reader = { path = "../remote-reader" }
app-contract = { path = "../app-contract" }
catalog-client = { path = "../catalog-client" }
metadata-client = { path = "../metadata-client" }
taxonomy-client = { path = "../taxonomy-client" }
library-model = { path = "../library-model" }
metadata-contract = { path = "../../shared/metadata-contract" }
taxonomy-contract = { path = "../../shared/taxonomy-contract" }
library-replica = { path = "../library-replica" }
sync-client = { path = "../sync-client" }
thumbnail = { path = "../thumbnail" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = {version = "0.37.0", features = ["bundled", "functions"] }
include-sqlite-sql = "0.2.1"
walkdir = "2.5.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
roxmltree = "0.20"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
notify = { version = "6.1", optional = true }
futures-util = "0.3"
html-publication = { path = "../../apps/renderers/html/crates/html-publication" }
epub_provider = { path = "../../apps/renderers/html/epub_provider" }
crossbeam-channel = "0.5"
sync-common = { path = "../../shared/sync-common" }
urlencoding = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
blake3 = "1"
pdf-reader-core = { path = "../../apps/renderers/pdf/core", optional = true }
dirs = "6"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
[dev-dependencies]
test-support = { path = "../test-support" }
axum = "0.7"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.44", default-features = false }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tempfile = "3"
zip.workspace = true
