[package]
name = "bokheim-backend"
version = "0.1.0"
description = "Bokheim application backend"
edition = "2021"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bokheim_backend"
crate-type = ["rlib"]

[features]
storage-contract-tests = ["client-platform-web/storage-contract-tests"]
web-runtime-tests = ["client-platform-web/web-runtime-tests", "publication-access/web-runtime-tests", "client-platform-runtime/web-runtime-tests"]
default = ["desktop"]
desktop = ["watcher", ]
scanner = ["library-files/scanner"]
watcher = ["scanner", "library-files/watcher"]
kobo = ["client-platform-kobo/device"]

[dependencies]
client-platform-desktop = { path = "../platforms/desktop" }
library-files = { path = "../library-files" }
client-platform-runtime = { path = "../platforms/runtime" }
publication-access = { path = "../publication-access", features = ["pdf"] }
pdf-view-common = { path = "../../apps/reader/crates/pdf/view-common" }
publication-enrichment = { path = "../../shared/publication-enrichment" }
publication-inspection = { path = "../../shared/publication-inspection" }
publication-identity = { path = "../../shared/publication-identity" }
book-metadata = { path = "../book-metadata" }
device-sqlite = { path = "../device-sqlite" }
account-contract = { path = "../../shared/account-contract" }
asset-transfer = { path = "../sync/asset-transfer" }
library-registry = { path = "../library-registry" }
app-preferences = { path = "../preferences" }
metadata-client = { path = "../metadata-client" }
library-model = { path = "../library-model" }
client-library = { path = "../library", default-features = false, features = ["audiobook-metadata"] }
library-runtime = { path = "../library-runtime" }
metadata-contract = { path = "../../shared/metadata-contract" }
subject-projection = { path = "../../shared/subject-projection" }
library-replica = { path = "../library-replica" }
account-client = { path = "../account-client" }
sync-engine = { path = "../sync/engine" }
sync-transport = { path = "../sync/transport" }
thumbnail = { path = "../thumbnail" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled", "functions", "hooks"] }
web-time = "1"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", features = ["io"] }
epub_provider = { path = "../../shared/epub" }
async-channel = "2"
sync-common = { path = "../../shared/sync-common" }
blake3 = "1"
rmp-serde = "1.3"
serde_bytes = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../platforms/web" }
futures-channel = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Event", "EventTarget", "File", "DedicatedWorkerGlobalScope", "MessageChannel", "MessageEvent", "MessageEventInit", "MessagePort", "SharedWorker", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../platforms/native", features = ["websocket"] }
client-platform-kobo = { path = "../platforms/kobo" }
publication-identity = { path = "../../shared/publication-identity", features = ["native-write"] }
tempfile = "3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
client-platform-android = { path = "../platforms/android" }

[dev-dependencies]
test-support = { path = "../test-support", features = ["pdf-fixtures"] }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.44", default-features = false }
tempfile = "3"
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
tokio = { version = "1.0", features = ["test-util"] }
axum = "0.7"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

