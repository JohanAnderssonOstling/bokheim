[package]
name = "bokheim-catalog"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
bokheim-app-contract = { path = "../BokheimAppContract" }
bokheim-domain = { path = "../BokheimDomain" }
bokheim-opds = { path = "../BokheimOpds" }
bokheim-wire = { path = "../BokheimWire" }
futures-util = "0.3"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
blake3 = "1"
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
