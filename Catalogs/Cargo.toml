[package]
name = "bokheim-catalog-server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.7"
blake3 = "1"
bokheim-app-contract = { path = "../BokheimAppContract" }
bokheim-catalog = { path = "../BokheimCatalogProvider" }
bokheim-opds = { path = "../BokheimOpds" }
bokheim-wire = { path = "../BokheimWire" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
