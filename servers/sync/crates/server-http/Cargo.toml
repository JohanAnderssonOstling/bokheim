[package]
name = "server-http"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.7", features = ["ws"] }
wire = { path = "../../../../crates/wire" }
futures-util = "0.3"
server-account = { path = "../server-account" }
server-asset-store = { path = "../server-asset-store" }
server-postgres = { path = "../server-postgres" }
server-wire-http = { path = "../server-wire-http" }
sync-common = { path = "../../../../crates/sync-common" }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"
