[package]
name = "sync-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    ".",
    "crates/server-account",
    "crates/server-postgres",
    "crates/server-asset-store",
    "crates/server-http",
    "crates/server-wire-http",
]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
private_interfaces = "deny"

[lints]
workspace = true

[dependencies]
axum = "0.7"
axum-server = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
server-postgres = { path = "crates/server-postgres" }
server-asset-store = { path = "crates/server-asset-store" }
server-http = { path = "crates/server-http" }
server-account = { path = "crates/server-account" }

[dev-dependencies]
account-contract = { path = "../../crates/account-contract" }
wire = { path = "../../crates/wire" }
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
sync-common = { path = "../../crates/sync-common" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
