[package]
name = "catalog-server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.7"
blake3 = "1"
catalog-contract = { path = "../../shared/catalog-contract" }
catalog-core = { path = "../../shared/catalog-core" }
book-metadata = { path = "../../client/book-metadata" }
library-model = { path = "../../client/library-model", features = ["authoritative-taxonomy"] }
metadata-contract = { path = "../../shared/metadata-contract" }
mobi.workspace = true
opds = { path = "../../shared/opds" }
lopdf = { version = "0.44", default-features = false }
roxmltree = "0.20"
thumbnail = { path = "../../client/thumbnail", features = ["pdf"] }
transport-wire = { package = "protobuf-wire", path = "../../shared/protobuf-wire" }
wire = { path = "../../shared/wire" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
tower = { version = "0.5", features = ["util"] }
zip.workspace = true
