[package]
name = "catalog-server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
publication-enrichment = { path = "../../shared/publication-enrichment" }
axum = "0.7"
blake3 = "1"
catalog-model = { path = "../../shared/catalog-model" }
catalog-core = { path = "../../shared/catalog-core" }
catalog-protocol = { path = "../../shared/catalog-protocol" }
publication-inspection = { path = "../../shared/publication-inspection", features = ["mobi"] }
publication-model = { path = "../../shared/publication-model" }
subject-projection = { path = "../../shared/subject-projection", features = ["authoritative-taxonomy"] }
metadata-contract = { path = "../../shared/metadata-contract" }
mobi.workspace = true
opds = { path = "crates/opds" }
lopdf = { version = "0.44", default-features = false }
roxmltree = "0.20"
thumbnail = { path = "../../client/thumbnail" }
transport-wire = { package = "protobuf-wire", path = "../../shared/protobuf-wire" }
wire = { path = "../../shared/wire" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
tower = { version = "0.5", features = ["util"] }
zip.workspace = true
