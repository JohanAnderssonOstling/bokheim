[package]
name = "opds"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
atom_syndication = { version = "0.12.10", default-features = false }
blake3 = "1"
futures-util = "0.3"
httpdate = "1"
log = "0.4"
litteraturbanken = { path = "../litteraturbanken" }
outbound = { package = "outbound-http", path = "../../../../shared/outbound-http" }
publication-model = { path = "../../../../shared/publication-model" }
quick-xml = "0.41"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
uri-template = "0.1.0"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js", "v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "0.7"
tempfile = "3"
