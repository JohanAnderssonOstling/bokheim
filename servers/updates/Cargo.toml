[package]
name = "update-publisher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
http-response = { workspace = true, features = ["blocking"] }
anyhow = "1"
fs2 = "0.4"
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
update-protocol = { path = "../../shared/update-protocol" }
url = "2"

[dev-dependencies]
ring = "0.17"
