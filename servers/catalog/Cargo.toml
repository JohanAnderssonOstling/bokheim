[package]
name = "catalog"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
description-storage = { path = "../../shared/description-storage" }
http-response = { workspace = true, features = ["blocking"] }
blake3 = "1"
book-inspection = { path = "../../client/library-backend/crates/book-inspection" }
book-model = { path = "../../shared/book-model" }
content-address = { path = "../../shared/content-address" }
flate2 = "1"
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
metadata-contract = { path = "../../shared/metadata-contract" }
ring = "0.17"
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
roxmltree = "0.20"
scraper.workspace = true
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subject-projection = { path = "../../shared/subject-projection" }
update-protocol = { path = "../../shared/update-protocol" }
thumbnail = { path = "../../client/library-backend/crates/thumbnail" }
zstd = "0.13"
zip.workspace = true

[dev-dependencies]
tempfile = "3"
