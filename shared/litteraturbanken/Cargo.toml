[package]
name = "litteraturbanken"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
