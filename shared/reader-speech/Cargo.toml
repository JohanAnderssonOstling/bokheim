[package]
name = "reader-speech"
version = "0.1.0"
edition = "2024"

[dependencies]
segment-parser = { path = "../../vendor/segment-parser/crates/segment-parser", default-features = false }
segment-rules = { path = "../../vendor/segment-parser/crates/segment-rules" }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
sherpa-onnx = "=1.13.8"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
libc = "0.2"
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
serde_json = "1"
sherpa-onnx = { version = "=1.13.8", default-features = false }
sherpa-onnx-sys = { version = "=1.13.8", default-features = false, features = ["runtime-tts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "alba_sample"

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = "0.3.2"
windows = { version = "0.62.2", features = ["Foundation", "Media_SpeechSynthesis", "Media_Core", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSDate", "NSRunLoop"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis", "AVAudioBuffer", "AVAudioTypes", "AVAudioFormat", "block2"] }
block2 = "0.6.2"
