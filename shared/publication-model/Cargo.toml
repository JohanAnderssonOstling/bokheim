[package]
name = "publication-model"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["random-ids"]
random-ids = ["uuid/v4"]

[lints]
workspace = true

[dependencies]
language-tags = "0.3.2"
serde = { version = "1", features = ["derive"] }
unicode-normalization.workspace = true
uuid = { version = "1", features = ["v5", "serde"] }

[dev-dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
serde_json = "1"
