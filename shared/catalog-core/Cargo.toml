[package]
name = "catalog-core"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
catalog-model = { path = "../catalog-model" }
outbound = { package = "outbound-http", path = "../outbound-http" }
thumbnail = { path = "../../client/thumbnail", default-features = false }
futures-util = { version = "0.3" }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
blake3 = "1"
log = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js", "v4"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
