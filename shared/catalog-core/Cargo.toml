[package]
name = "catalog-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["provider", "cover-cache"]
provider = ["dep:futures-util", "dep:image", "dep:opds", "dep:reqwest", "dep:sys-locale", "dep:thumbnail", "dep:tokio"]
cover-cache = ["provider", "tokio/fs"]

[lints]
workspace = true

[dependencies]
catalog-contract = { path = "../catalog-contract" }
catalog-model = { path = "../catalog-model" }
library-model = { path = "../../client/library-model" }
metadata-contract = { path = "../metadata-contract" }
opds = { path = "../opds", optional = true }
publication-model = { path = "../publication-model" }
subject-projection = { path = "../subject-projection" }
thumbnail = { path = "../../client/thumbnail", default-features = false, optional = true }
wire = { path = "../wire" }
futures-util = { version = "0.3", optional = true }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
blake3 = "1"
log = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"], optional = true }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite = "0.40.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = { version = "0.3.2", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"], optional = true }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "rustls-tls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
tokio = { version = "1", features = ["net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
axum = "0.7"
library-model = { path = "../../client/library-model", features = ["authoritative-taxonomy"] }
subject-projection = { path = "../subject-projection", features = ["authoritative-taxonomy"] }
tempfile = "3"
