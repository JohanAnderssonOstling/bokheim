[package]
name = "http-response"
version = "0.1.0"
edition = "2021"
publish = false

[features]
blocking = ["reqwest/blocking"]

[dependencies]
futures-util = "0.3"
reqwest = { workspace = true, features = ["stream"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
