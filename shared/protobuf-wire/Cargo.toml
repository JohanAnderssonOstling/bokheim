[package]
name = "protobuf-wire"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde-value = "0.7.0"
serde-transport = { path = "../serde-transport" }

[dev-dependencies]
serde_bytes = "0.11"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
