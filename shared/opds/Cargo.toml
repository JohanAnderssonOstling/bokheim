[package]
name = "opds"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ammonia = "4.1"
atom_syndication = { version = "0.12.10", default-features = false }
blake3 = "1"
futures-util = "0.3"
httpdate = "1"
html.workspace = true
log = "0.4"
litteraturbanken = { path = "../litteraturbanken" }
publication-model = { path = "../publication-model" }
quick-xml = "0.41"
reqwest = { version = "0.11", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uri-template = "0.1.0"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zip.workspace = true

[dev-dependencies]
axum = "0.7"
tempfile = "3"
