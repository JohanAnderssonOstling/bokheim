[package]
name = "content-address"
version = "0.1.0"
edition = "2021"
publish = false

[features]
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.40", optional = true }
blake3 = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
wire = { path = "../wire" }
protobuf-wire = { path = "../protobuf-wire" }
lopdf = { version = "0.44", default-features = false }
tempfile = "3"

[lints]
workspace = true
