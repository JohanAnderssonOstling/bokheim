[package]
name = "subject-taxonomy"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
csv = "1.3.1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v5"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js", "v5"] }

[dev-dependencies]
bincode = { version = "2", default-features = false, features = ["serde", "std"] }
