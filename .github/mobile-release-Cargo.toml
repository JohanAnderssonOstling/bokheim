[workspace]
resolver = "3"
members = [
    "apps/mobile/src-tauri",
    "client/app-contract",
    "client/audiobook-library",
    "client/backend",
    "client/book-metadata",
    "client/catalog-client",
    "client/library-model",
    "client/library-registry",
    "client/library-replica",
    "client/remote-reader",
    "client/sync-client",
    "client/test-support",
    "client/thumbnail",
    "shared/account-contract",
    "shared/catalog-contract",
    "shared/catalog-core",
    "shared/catalog-model",
    "shared/content-address",
    "shared/litteraturbanken",
    "shared/metadata-contract",
    "shared/opds",
    "shared/protocol-test-support",
    "shared/sync-common",
    "shared/wire",
    "apps/renderers/html/crates/html-publication",
    "apps/renderers/html/epub_provider",
    "apps/renderers/pdf/core",
    "apps/renderers/pdf/view-common",
    "apps/renderers/shared/reader-style",
]

[workspace.lints]

[workspace.dependencies]
html = { package = "html-engine", git = "https://github.com/JohanAnderssonOstling/HtmlEngine" }
pdfium-render = { version = "0.9.3", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
mobi = "0.8.0"
encoding_rs = "0.8"
unicode-normalization = "0.1"

# The full development workspace includes the local GPUI fork used by the
# desktop renderer. Android releases intentionally use this self-contained
# workspace because the mobile application does not depend on GPUI.
