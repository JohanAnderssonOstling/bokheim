name: Sign prepared Android release
on:
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      tag:
        required: true
        type: string
      unsigned_sha256:
        required: false
        type: string
      verify_only:
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing production signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bokheim-android-release.jks'
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          certificate = subprocess.check_output(['keytool', '-exportcert', '-alias', os.environ['KEY_ALIAS'], '-keystore', str(path), '-storepass:env', 'STORE_PASSWORD'])
          actual = hashlib.sha256(certificate).hexdigest()
          expected = '97220997a830cbd326ab178a7467b1c85e7af172f5560b3ec29e54e457b384f0'
          if actual != expected:
              raise RuntimeError('GitHub signing key differs from the published Android release: ' + actual)
          print('Production signing certificate matches the published app: ' + actual)
          PY
      - name: Download and verify prepared unsigned APK
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA256: ${{ inputs.unsigned_sha256 }}
        run: |
          set -e
          mkdir prepared signed
          gh release download "$RELEASE_TAG" --repo JohanAnderssonOstling/bokheim-release --pattern Bokheim-Android-arm64-unsigned.apk --dir prepared
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('apps/desktop-gpui/Cargo.toml').read_text())['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise RuntimeError('Source version differs from release tag')
          expected = os.environ['EXPECTED_SHA256']
          if not re.fullmatch('[0-9a-f]{64}', expected):
              raise RuntimeError('Expected a SHA-256 fingerprint')
          apk = pathlib.Path('prepared/Bokheim-Android-arm64-unsigned.apk')
          with apk.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise RuntimeError('Unsigned APK fingerprint mismatch')
          sdk = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          if not sdk.is_dir():
              subprocess.run(['sdkmanager', 'build-tools;36.0.0'], check=True)
          badging = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          major, minor, patch = map(int, version.split('.'))
          code = major * 1000000 + minor * 1000 + patch
          if f"package: name='se.bokheim.reader.gpui' versionCode='{code}' versionName='{version}'" not in badging:
              raise RuntimeError('Unsigned APK package or version mismatch')
          if 'application-debuggable' in badging or not re.search(r"^native-code: 'arm64-v8a'\s*$", badging, re.M):
              raise RuntimeError('Expected a non-debuggable ARM64 APK')
          PY
      - name: Sign the verified APK without rebuilding
        if: ${{ !inputs.verify_only }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          sdk = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bokheim-android-release.jks'
          apk = pathlib.Path('signed/Bokheim-Android-arm64.apk')
          unsigned = pathlib.Path('prepared/Bokheim-Android-arm64-unsigned.apk')
          subprocess.run([str(sdk / 'apksigner'), 'sign', '--ks', str(key), '--ks-key-alias', os.environ['KEY_ALIAS'], '--ks-pass', 'env:STORE_PASSWORD', '--key-pass', 'env:KEY_PASSWORD', '--v1-signing-enabled', 'false', '--v2-signing-enabled', 'true', '--v3-signing-enabled', 'true', '--v4-signing-enabled', 'false', '--out', str(apk), str(unsigned)], check=True)
          signature = subprocess.check_output([str(sdk / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          expected = '97220997a830cbd326ab178a7467b1c85e7af172f5560b3ec29e54e457b384f0'
          if re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$', signature, re.M) != [expected]:
              raise RuntimeError('Signed APK certificate mismatch')
          with zipfile.ZipFile(unsigned) as before, zipfile.ZipFile(apk) as after:
              names = lambda archive: {n for n in archive.namelist() if not n.startswith('META-INF/')}
              if names(before) != names(after) or any(before.read(n) != after.read(n) for n in names(before)):
                  raise RuntimeError('Signing changed the APK payload')
          subprocess.run([str(sdk / 'zipalign'), '-c', '-P', '16', '4', str(apk)], check=True)
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          pathlib.Path('signed/android-signing-receipt.json').write_text(json.dumps({'source_commit': os.environ['SOURCE_COMMIT'], 'unsigned_sha256': os.environ['UNSIGNED_SHA256'], 'signed_sha256': digest, 'certificate_sha256': expected, 'payload_unchanged': True}, indent=2) + '\n')
          print('Prepared release APK signed and verified with unchanged payload.')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.verify_only }}
        with:
          name: android-signed-release
          path: signed/
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/bokheim-android-release.jks"
