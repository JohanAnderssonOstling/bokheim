name: GPUI desktop AppImage release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: desktop-appimage-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  RUST_VERSION: 1.95.0
  GPUI_FORK_REF: 68b0a5ba82860ac222c18acd9036b3838a43a08b
  HTML_ENGINE_REF: 30b27e095b038a1a690b3e80c1e1501f3145281e
  HTML_VIEW_CORE_REF: 61a4667f6d47bc1de47e5437ec40f55f70d41fdc
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  APPIMAGETOOL_VERSION: 1.9.1
  PDFIUM_LINUX_X64_URL: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7961/pdfium-linux-x64.tgz
  PDFIUM_LINUX_X64_SHA256: 019665c8877d46fe65f625f80fd714ab07aac68554b0636acf2a2adf9288adb2

jobs:
  build:
    name: x86-64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out Bokheim
        uses: actions/checkout@v6
        with:
          path: bokheim

      - name: Check out GPUI-Fork
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: ${{ env.GPUI_FORK_REF }}
          path: GPUI-Fork

      - name: Check out HtmlEngine
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: ${{ env.HTML_ENGINE_REF }}
          path: HtmlEngine

      - name: Check out HtmlViewCore
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: ${{ env.HTML_VIEW_CORE_REF }}
          path: HtmlViewCore

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            binutils \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            zsync

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore Cargo dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: bokheim-cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('bokheim/Cargo.lock') }}
          restore-keys: |
            bokheim-cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-

      - name: Restore Cargo release build artifacts
        uses: actions/cache@v5
        with:
          path: |
            bokheim/target/release
          key: bokheim-appimage-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-gpui-${{ env.GPUI_FORK_REF }}-engine-${{ env.HTML_ENGINE_REF }}-view-${{ env.HTML_VIEW_CORE_REF }}-${{ hashFiles('bokheim/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bokheim-appimage-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-gpui-${{ env.GPUI_FORK_REF }}-engine-${{ env.HTML_ENGINE_REF }}-view-${{ env.HTML_VIEW_CORE_REF }}-
            bokheim-appimage-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-

      - name: Download pinned AppImage packaging tools
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage" \
            --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          chmod +x \
            "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Download pinned PDFium
        shell: bash
        run: |
          PDFIUM_ARCHIVE="$RUNNER_TEMP/pdfium-linux-x64.tgz"
          curl --fail --location --retry 3 \
            "$PDFIUM_LINUX_X64_URL" \
            --output "$PDFIUM_ARCHIVE"
          printf '%s  %s\n' "$PDFIUM_LINUX_X64_SHA256" "$PDFIUM_ARCHIVE" | sha256sum --check -
          echo "PDFIUM_ARCHIVE_PATH=$PDFIUM_ARCHIVE" >> "$GITHUB_ENV"

      - name: Check tagged version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: bokheim
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop-gpui/Cargo.toml | head -n 1)
          test "v${VERSION}" = "$GITHUB_REF_NAME"

      - name: Verify the desktop dependency graph is GPUI-only
        working-directory: bokheim
        shell: bash
        run: |
          cargo tree --locked -p desktop-gpui --no-default-features --features desktop > "$RUNNER_TEMP/desktop-dependency-tree.txt"
          if grep -E -i '(^|[[:space:]])(tauri|wry|webkit2gtk|mobileapp)([[:space:]]|$)' "$RUNNER_TEMP/desktop-dependency-tree.txt"; then
            echo "The GPUI AppImage must not depend on Tauri or the mobile application." >&2
            exit 1
          fi

      - name: Build GPUI desktop release
        working-directory: bokheim
        run: cargo build --locked --release -p desktop-gpui --bin desktop-gpui --no-default-features --features desktop

      - name: Build updateable AppImage
        working-directory: bokheim
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          LINUXDEPLOY: ${{ runner.temp }}/linuxdeploy-x86_64.AppImage
        run: apps/desktop-gpui/linux/appimage/build-appimage.sh

      - name: Verify AppImage runtime and payload
        working-directory: bokheim
        shell: bash
        run: |
          release/Bokheim-x86_64.AppImage --appimage-version
          release/Bokheim-x86_64.AppImage --appimage-updateinformation
          release/Bokheim-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/desktop-gpui
          test -f squashfs-root/se.bokheim.Bokheim.desktop
          test -e squashfs-root/se.bokheim.Bokheim.svg -o -e squashfs-root/se.bokheim.Bokheim.png
          test -s release/Bokheim-x86_64.AppImage.zsync
          sha256sum --check release/Bokheim-x86_64.AppImage.sha256
          ldd squashfs-root/usr/bin/desktop-gpui > "$RUNNER_TEMP/appimage-ldd.txt"
          cat "$RUNNER_TEMP/appimage-ldd.txt"
          if grep -F 'not found' "$RUNNER_TEMP/appimage-ldd.txt"; then
            echo "The packaged desktop executable has unresolved shared libraries." >&2
            exit 1
          fi
          apps/desktop-gpui/linux/appimage/verify-glibc-compatibility.sh release/Bokheim-x86_64.AppImage 2.35
          apps/desktop-gpui/linux/appimage/verify-glibc-compatibility.sh squashfs-root 2.35

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bokheim-desktop-appimage-x86-64
          path: bokheim/release/*
          if-no-files-found: error

      - name: Create or update draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: bokheim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --verify-tag \
              --title "Bokheim ${GITHUB_REF_NAME#v}" || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
