name: Android Play Store bundle

# Builds the Android App Bundle for Google Play. Unlike the APK release this is
# manual only: uploading to Play is a deliberate act, and the listing has to
# exist in the Play Console before a bundle can be attached to it.
#
# The bundle differs from the sideloaded APK in one way that matters: it is
# built with BOKHEIM_PLAY_STORE=1, which drops the self-updater and the
# REQUEST_INSTALL_PACKAGES permission that Play's Device and Network Abuse
# policy forbids. The job asserts both, so a regression fails here rather than
# in review.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed Play bundle
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      BOKHEIM_PLAY_STORE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Android SDK tooling
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust build targets
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android armv7-linux-androideabi wasm32-unknown-unknown

      - name: Select the self-contained mobile workspace
        shell: bash
        run: cp .github/mobile-release-Cargo.toml Cargo.toml

      - name: Restore Rust dependencies and build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: android-play-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('Cargo.lock', '.github/mobile-release-Cargo.toml') }}
          restore-keys: |
            android-play-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-${{ env.NDK_VERSION }}-

      - name: Install frontend dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Check frontend and design tokens
        working-directory: apps/mobile
        run: |
          npm run check
          npm run check:tokens

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::The GitHub secret for $variable is missing or empty."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/bokheim-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Regenerate it with: base64 -w 0 bokheim-release.jks"
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          chmod 600 "$keystore"
          if ! keytool_error=$(keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            printf '%s\n' "$keytool_error"
            echo "::error::The decoded keystore is invalid, or the password or alias is wrong."
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > apps/mobile/src-tauri/gen/android/keystore.properties

      - name: Build signed release bundle
        working-directory: apps/mobile
        run: npm run tauri -- android build --aab --target aarch64 armv7

      - name: Collect the bundle
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")
          AAB=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*release*.aab' ! -name '*unsigned*' -print -quit)
          test -n "$AAB"
          mkdir -p release-play
          cp "$AAB" "release-play/bokheim-v${VERSION}.aab"
          echo "AAB=$PWD/release-play/bokheim-v${VERSION}.aab" >> "$GITHUB_ENV"

      - name: Assert the self-updater is absent
        shell: bash
        run: |
          manifest=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$AAB" \
            --file base/manifest/AndroidManifest.xml)
          if printf '%s' "$manifest" | grep -q 'REQUEST_INSTALL_PACKAGES'; then
            echo "::error::The Play bundle still declares REQUEST_INSTALL_PACKAGES. Google Play will reject it."
            exit 1
          fi
          printf '%s' "$manifest" | grep -E 'uses-permission|versionCode|versionName'

      - name: Assert 16 KB page alignment
        shell: bash
        run: |
          # Android 15+ requires new uploads to load on 16 KB page devices, so
          # every bundled .so must have LOAD segments aligned to 0x4000.
          workdir=$(mktemp -d)
          unzip -q "$AAB" -d "$workdir"
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          status=0
          while IFS= read -r lib; do
            aligns=$("$readelf" -l "$lib" | awk '$1 == "LOAD" { print $NF }')
            for align in $aligns; do
              case "$align" in
                0x4000|0x10000|0x40000) ;;
                *)
                  echo "::error::$(basename "$lib") has a LOAD segment aligned to $align, below the 16 KB requirement."
                  status=1
                  ;;
              esac
            done
          done < <(find "$workdir" -name '*.so')
          exit $status

      - name: Retain the bundle
        uses: actions/upload-artifact@v4
        with:
          name: bokheim-play-bundle
          path: release-play/*
          if-no-files-found: error
          retention-days: 30
