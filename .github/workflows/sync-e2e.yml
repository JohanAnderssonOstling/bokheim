name: Shared release tests (own runner)

# Never execute untrusted pull requests automatically on the private runner.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  statuses: write

concurrency:
  group: shared-tests-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  shared-tests:
    runs-on: [self-hosted, linux, x64, bokheim-shared]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bokheim
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      RUSTC_BOOTSTRAP: '1'
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      REPORT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: bokheim
      # Match the pinned sibling sources used by desktop-release.yml.
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: c0d74d1df53c1ed1a1ef61afdf12893afcfc56fa
          path: GPUI-Fork
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: b57416f7c0774851e08ff988fdd42e6ed634cc37
          path: HtmlEngine
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: d33fe55fb431b7af8107a8aca3cef4250e3a25a9
          path: HtmlViewCore
      - name: Run shared suite and report this commit
        run: |
          # Independent platform runs reuse a successful result for this exact SHA.
          if python3 scripts/ci/require-shared-tests.py "$REPORT_REPOSITORY" "$GITHUB_SHA"; then
            exit 0
          fi
          # Keep optimized dependencies outside the checkout cleaned between jobs.
          export CARGO_TARGET_DIR="$RUNNER_TOOL_CACHE/bokheim-shared-tests"
          export SYNC_E2E_BACKEND_TARGET_DIR="$CARGO_TARGET_DIR"
          export SYNC_E2E_SERVER_TARGET_DIR="$RUNNER_TOOL_CACHE/bokheim-sync-server"
          python3 scripts/ci/shared-tests.py --report "$REPORT_REPOSITORY"
