name: Sync PostgreSQL E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sync-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "client/backend/**"
      - "client/library/**"
      - "client/library-files/**"
      - "client/sync/**"
      - "client/test-support/**"
      - "client/book-access/**"
      - "client/account-client/**"
      - "shared/book-enrichment/**"
      - "shared/book-model/**"
      - "client/platforms/**"
      - "scripts/checks/library-sql.py"
      - "scripts/checks/backend-boundaries.py"
      - "scripts/checks/tests/**"
      - "servers/sync/**"
      - "shared/account-contract/**"
      - "shared/protocol-test-support/**"
      - "shared/sync-common/**"
      - "shared/wire/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "client/backend/**"
      - "client/library/**"
      - "client/library-files/**"
      - "client/sync/**"
      - "client/test-support/**"
      - "client/book-access/**"
      - "client/account-client/**"
      - "shared/book-enrichment/**"
      - "shared/book-model/**"
      - "client/platforms/**"
      - "scripts/checks/library-sql.py"
      - "scripts/checks/backend-boundaries.py"
      - "scripts/checks/tests/**"
      - "servers/sync/**"
      - "shared/account-contract/**"
      - "shared/protocol-test-support/**"
      - "shared/sync-common/**"
      - "shared/wire/**"

permissions:
  contents: read

jobs:
  sync-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sync_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sync_e2e
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Test architecture checks
        run: python3 -m unittest discover -s scripts/checks/tests

      - name: Check feature SQL organization
        run: python3 scripts/checks/library-sql.py

      - name: Check backend service boundaries
        run: python3 scripts/checks/backend-boundaries.py

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Test extracted client services
        run: cargo test --release -p account-client -p book-access -p book-enrichment -p book-model -p library-files -p asset-transfer -p client-platform-runtime -p sync-engine --all-features --lib

      - name: Run synchronization E2E suite
        run: client/backend/tests/run_sync_e2e.sh
