name: Android APK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the APK to the shared draft release for this version
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed ARM64 APK
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Android SDK tooling
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust build targets
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android wasm32-unknown-unknown

      - name: Select the self-contained mobile workspace
        shell: bash
        run: cp .github/mobile-release-Cargo.toml Cargo.toml

      - name: Restore Rust dependencies and build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: android-rust-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('Cargo.lock', '.github/mobile-release-Cargo.toml') }}
          restore-keys: |
            android-rust-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-${{ env.NDK_VERSION }}-

      - name: Install frontend dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Check tagged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")
          test "v${VERSION}" = "$GITHUB_REF_NAME"

      - name: Check frontend and design tokens
        working-directory: apps/mobile
        run: |
          npm run check
          npm run check:tokens

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::The GitHub secret for $variable is missing or empty."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/bokheim-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Regenerate it with: base64 -w 0 bokheim-release.jks"
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          chmod 600 "$keystore"
          echo "Decoded keystore SHA-256: $(sha256sum "$keystore" | cut -d ' ' -f 1)"
          if ! keytool_error=$(keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" 2>&1); then
            printf '%s\n' "$keytool_error"
            echo "::error::The decoded keystore is invalid or ANDROID_KEYSTORE_PASSWORD is incorrect."
            exit 1
          fi
          if ! keytool_error=$(keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            printf '%s\n' "$keytool_error"
            echo "::error::ANDROID_KEY_ALIAS does not exist in the decoded keystore."
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > apps/mobile/src-tauri/gen/android/keystore.properties

      - name: Build signed release APK
        working-directory: apps/mobile
        run: npm run tauri -- android build --apk --target aarch64

      - name: Verify and name release files
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")
          APK=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' ! -name '*unsigned*' -print -quit)
          test -n "$APK"
          mkdir -p release
          cp "$APK" "release/bokheim-v${VERSION}-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/bokheim-v${VERSION}-arm64.apk"
          cd release
          sha256sum "bokheim-v${VERSION}-arm64.apk" > "bokheim-v${VERSION}-arm64.apk.sha256"
          # Stable-named copy so bokheim.se can link to a permanent
          # releases/latest/download URL that survives version bumps.
          cp "bokheim-v${VERSION}-arm64.apk" bokheim-arm64.apk
          sha256sum bokheim-arm64.apk > bokheim-arm64.apk.sha256

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bokheim-android-arm64
          path: release/*
          if-no-files-found: error

      - name: Create or update draft GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          # A manual run is not on a tag, so GITHUB_REF_NAME is the branch:
          # take the tag from the version the APK was actually built from. The
          # tagged runs already checked that the two agree.
          VERSION=$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")
          RELEASE_TAG="v${VERSION}"
          if ! gh release view "$RELEASE_TAG" --repo JohanAnderssonOstling/bokheim-release >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo JohanAnderssonOstling/bokheim-release \
              --target main \
              --draft \
              --generate-notes \
              --title "Bokheim ${VERSION}" || \
              gh release view "$RELEASE_TAG" --repo JohanAnderssonOstling/bokheim-release >/dev/null
          fi
          gh release upload "$RELEASE_TAG" release/* \
            --repo JohanAnderssonOstling/bokheim-release \
            --clobber

      - name: Save Rust dependencies and build artifacts
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
