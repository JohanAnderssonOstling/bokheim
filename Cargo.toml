[workspace]
resolver = "3"
members = [
    "client/backend",
    "client/library-replica",
    "client/library-registry",
    "client/book-metadata",
    "client/thumbnail",
    "client/audiobook-library",
    "client/preferences",
    "client/library-model",
    "client/test-support",
    "shared/content-address",
    "shared/outbound-http",
    "shared/catalog-model",
    "shared/catalog-protocol",
    "shared/publication-model",
    "shared/epub",
    "shared/publication-inspection",
    "shared/subject-projection",
    "servers/opds-cache/crates/litteraturbanken",
    "servers/opds-cache/crates/opds",
    "shared/account-contract",
    "shared/catalog-core",
    "client/catalog-client",
    "client/metadata-client",
    "shared/wire",
    "shared/protobuf-wire",
    "shared/metadata-contract",
    "shared/taxonomy-contract",
    "shared/sync-common",
    "apps/desktop-gpui",
    "apps/web-gpui",
    "apps/kobo-device",
    "servers/opds-cache",
    "servers/metadata",
    "servers/taxonomy"
]
exclude = ["servers/sync"]

[workspace.lints]

[profile.web-release]
inherits = "release"
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.dependencies]
html = { package = "html-engine", git = "https://github.com/JohanAnderssonOstling/HtmlEngine" }
html-view-core = { git = "https://github.com/JohanAnderssonOstling/HtmlViewCore" }
kurbo = "0.11.3"
peniko = "0.2.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["substitute_variables"] }
parcel_selectors = "0.28.2"
scraper = "0.27"
unicode-normalization = "0.1"
gpui = { path = "../GPUI-Fork/crates/gpui" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform", features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
pdfium-render = { version = "0.9.3", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
mobi = "0.8.0"
encoding_rs = "0.8"

[patch.crates-io]
gpui = { path = "../GPUI-Fork/crates/gpui" }
pdfium-render = { path = "vendor/pdfium-render" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../GPUI-Fork/crates/gpui" }
gpui_macros = { path = "../GPUI-Fork/crates/gpui_macros" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform" }

# Temporary: note rendering needs unpushed HtmlViewCore work.
[patch."https://github.com/JohanAnderssonOstling/HtmlEngine"]
html-engine = { path = "../HtmlEngine/crates/html" }

[patch."https://github.com/JohanAnderssonOstling/HtmlViewCore"]
html-view-core = { path = "../HtmlViewCore/crates/html-view-core" }
