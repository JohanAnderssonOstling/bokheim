[workspace]
resolver = "3"
members = [
    "Backend",
    "BookFormat",
    "MobileApp/src-tauri",
    "SyncCommon",
    "UI",
    "data-analysis",
    "HtmlRenderer",
    "HtmlRenderer/crates/html-dom",
    "HtmlRenderer/crates/html-style-model",
    "HtmlRenderer/crates/html-style",
    "HtmlRenderer/crates/html-parse",
    "HtmlRenderer/crates/html-source",
    "HtmlRenderer/crates/html-resources",
    "HtmlRenderer/crates/html-layout",
    "HtmlRenderer/crates/html-pipeline",
    "HtmlRenderer/crates/html-view-core",
    "HtmlRenderer/crates/html-view-gpui",
    "HtmlRenderer/test-support/html-wpt",
    "HtmlRenderer/gpui-smoke",
    "HtmlRenderer/floem-smoke",
    "ReaderStyle",
    "PdfRenderer",
    "GPUI/bokheim-desktop",
    "GPUI/browser-ui",
    "GPUI/reader-ui",
    "GPUI/pdf-view-gpui",
    "GPUI/bokheim-ui-components",
    "GPUI/bokheim-ui-runtime"
]
exclude = ["Server"]

[workspace.dependencies]
kurbo = "0.11.3"
peniko = "0.2.0"
lightningcss = { version = "1.0.0-alpha.68", features = ["substitute_variables"] }
parcel_selectors = "0.28.2"
scraper = "0.27"
html5ever = "0.39"
ego-tree = "0.11"
gpui = { path = "../GPUI-Fork/crates/gpui" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform", features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
pdfium-render = { version = "0.9.3", default-features = false }

[patch.crates-io]
gpui = { path = "../GPUI-Fork/crates/gpui" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../GPUI-Fork/crates/gpui" }
gpui_macros = { path = "../GPUI-Fork/crates/gpui_macros" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform" }
