[workspace]
resolver = "3"
members = [
    "Backend",
    "BokheimDomain",
    "BokheimOpds",
    "BokheimAccountContract",
    "BokheimAppContract",
    "BokheimCatalogProvider",
    "BokheimSyncClient",
    "BokheimLibraryFiles",
    "BokheimIdentifiers",
    "Backend/crates/book-metadata",
    "Backend/crates/library-registry",
    "Backend/crates/remote-reader",
    "Backend/crates/projection",
    "Backend/crates/storage-sqlite",
    "Backend/crates/thumbnail",
    "Catalogs",
    "AudiobookLibrary",
    "BokheimAlgorithms",
    "BokheimWire",
    "MobileApp/src-tauri",
    "SyncCommon",
    "data-analysis",
    "HtmlRenderer",
    "HtmlRenderer/crates/html-publication",
    "HtmlRenderer/crates/html-view-gpui",
    "HtmlRenderer/floem-smoke",
    "ReaderStyle",
    "PdfViewCommon",
    "PdfRenderer",
    "GPUI/bokheim-desktop",
    "GPUI/browser-ui",
    "GPUI/reader-ui",
    "GPUI/pdf-view-gpui",
    "GPUI/bokheim-ui-components",
    "GPUI/bokheim-ui-runtime"
    ,"GPUI/audiobook-player",
    "GPUI/kobo-device"
]
exclude = ["Server"]

[workspace.lints]

[workspace.dependencies]
html = { package = "html-engine", git = "https://github.com/JohanAnderssonOstling/HtmlEngine" }
html-view-core = { git = "https://github.com/JohanAnderssonOstling/HtmlViewCore" }
kurbo = "0.11.3"
peniko = "0.2.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["substitute_variables"] }
parcel_selectors = "0.28.2"
scraper = "0.27"
unicode-normalization = "0.1"
gpui = { path = "../GPUI-Fork/crates/gpui" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform", features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
pdfium-render = { version = "0.9.3", default-features = false }

[patch.crates-io]
gpui = { path = "../GPUI-Fork/crates/gpui" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../GPUI-Fork/crates/gpui" }
gpui_macros = { path = "../GPUI-Fork/crates/gpui_macros" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform" }
