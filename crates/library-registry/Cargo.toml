[package]
name = "library-registry"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
library-files = { path = "../library-files" }
identifiers = { path = "../identifiers" }
csv = "1.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
