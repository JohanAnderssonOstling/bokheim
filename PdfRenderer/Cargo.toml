[package]
name = "pdf-reader-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
pdfium-render = { workspace = true, features = ["pdfium_latest", "thread_safe"] }
reader-style = { path = "../ReaderStyle" }

[build-dependencies]
flate2 = "1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
ureq = "3"
