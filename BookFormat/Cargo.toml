[package]
name = "book-format"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.44", default-features = false }
mp4ameta = "0.13.0"
percent-encoding = "2"
quick-xml = "0.31"
serde_json = "1"
thiserror = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
