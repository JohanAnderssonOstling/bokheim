[package]
name = "book-format"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
image = { version = "0.24.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lopdf = { version = "0.44", default-features = false }
percent-encoding = "2"
quick-xml = "0.31"
thiserror = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
