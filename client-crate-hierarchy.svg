<svg xmlns="http://www.w3.org/2000/svg" width="920" height="850" viewBox="0 0 920 850" role="img" aria-labelledby="title desc">
  <title id="title">Client crate hierarchy</title>
  <desc id="desc">The client directory and its fifteen Rust crates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 400 15px system-ui, sans-serif; fill: #64748b; }
      .root-label { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fff; }
      .crate-label { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .package-label { font: 400 12px system-ui, sans-serif; fill: #64748b; }
      .branch { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .dot { fill: #6366f1; }
    </style>
  </defs>

  <rect width="920" height="850" rx="24" fill="url(#background)"/>
  <text x="54" y="58" class="title">Client crate hierarchy</text>
  <text x="54" y="84" class="subtitle">Rust workspace · client crates only</text>

  <g filter="url(#shadow)">
    <rect x="54" y="116" width="190" height="58" rx="12" fill="#4f46e5"/>
  </g>
  <text x="80" y="152" class="root-label">client/</text>

  <!-- The root fans out into two compact columns of crates. -->
  <path class="branch" d="M149 174 V595 M149 174 H590 V451"/>

  <!-- Crate nodes -->
  <g>
    <path class="branch" d="M149 205 H188"/><circle class="dot" cx="149" cy="205" r="4"/>
    <rect class="node" x="188" y="184" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="211">audiobook-library</text>

    <path class="branch" d="M149 247 H188"/><circle class="dot" cx="149" cy="247" r="4"/>
    <rect class="node" x="188" y="232" width="370" height="54" rx="9"/>
    <text class="crate-label" x="206" y="254">backend</text>
    <text class="package-label" x="206" y="273">package: bokheim-backend</text>

    <path class="branch" d="M149 307 H188"/><circle class="dot" cx="149" cy="307" r="4"/>
    <rect class="node" x="188" y="292" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="319">book-metadata</text>

    <path class="branch" d="M149 355 H188"/><circle class="dot" cx="149" cy="355" r="4"/>
    <rect class="node" x="188" y="340" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="367">catalog-client</text>

    <path class="branch" d="M149 403 H188"/><circle class="dot" cx="149" cy="403" r="4"/>
    <rect class="node" x="188" y="388" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="415">device-sqlite</text>

    <path class="branch" d="M149 451 H188"/><circle class="dot" cx="149" cy="451" r="4"/>
    <rect class="node" x="188" y="436" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="463">library-model</text>

    <path class="branch" d="M149 499 H188"/><circle class="dot" cx="149" cy="499" r="4"/>
    <rect class="node" x="188" y="484" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="511">library-registry</text>

    <path class="branch" d="M149 547 H188"/><circle class="dot" cx="149" cy="547" r="4"/>
    <rect class="node" x="188" y="532" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="559">library-replica</text>

    <path class="branch" d="M149 595 H188"/><circle class="dot" cx="149" cy="595" r="4"/>
    <rect class="node" x="188" y="580" width="370" height="42" rx="9"/>
    <text class="crate-label" x="206" y="607">library-sqlite</text>

    <path class="branch" d="M590 205 H610"/><circle class="dot" cx="590" cy="205" r="4"/>
    <rect class="node" x="610" y="184" width="256" height="42" rx="9"/>
    <text class="crate-label" x="628" y="211">metadata-client</text>

    <path class="branch" d="M590 247 H610"/><circle class="dot" cx="590" cy="247" r="4"/>
    <rect class="node" x="610" y="232" width="256" height="54" rx="9"/>
    <text class="crate-label" x="628" y="254">preferences</text>
    <text class="package-label" x="628" y="273">package: app-preferences</text>

    <path class="branch" d="M590 307 H610"/><circle class="dot" cx="590" cy="307" r="4"/>
    <rect class="node" x="610" y="292" width="256" height="42" rx="9"/>
    <text class="crate-label" x="628" y="319">sync-client</text>

    <path class="branch" d="M590 355 H610"/><circle class="dot" cx="590" cy="355" r="4"/>
    <rect class="node" x="610" y="340" width="256" height="42" rx="9"/>
    <text class="crate-label" x="628" y="367">taxonomy-client</text>

    <path class="branch" d="M590 403 H610"/><circle class="dot" cx="590" cy="403" r="4"/>
    <rect class="node" x="610" y="388" width="256" height="42" rx="9"/>
    <text class="crate-label" x="628" y="415">test-support</text>

    <path class="branch" d="M590 451 H610"/><circle class="dot" cx="590" cy="451" r="4"/>
    <rect class="node" x="610" y="436" width="256" height="42" rx="9"/>
    <text class="crate-label" x="628" y="463">thumbnail</text>
  </g>

  <text x="54" y="825" class="subtitle">15 crates · directory names shown; package aliases noted</text>
</svg>
